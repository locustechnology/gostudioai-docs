openapi: 3.0.3
info:
  title: GoStudio API
  version: "2.0.0"
  description: >
    The GoStudio API v2. Every generation endpoint creates a **job**. You get a
    `job_id` back, and the finished pictures come back either in the same
    response (sync) or when you poll `GET /api/v2/jobs/{job_id}` (async).


    Requests and responses are JSON. Successful responses look like
    `{ "status": 200, "data": { ... } }`. Errors look like
    `{ "status": 4xx, "error": { "type", "code", "message" } }`.


    Credits are taken when a job is accepted and returned automatically if the
    job fails.

servers:
  - url: https://www.gostudio.ai
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Jobs
    description: Check the state of a job after a `202` response.
  - name: Apps
    description: One-step photo tools — Age Modifier, Watermark Remover, Weight Shift and Group Photo.
  - name: AI Image
    description: Create images from a prompt, or edit existing images with a prompt.
  - name: AI Video
    description: Make videos from a prompt, keyframes, reference images or an existing clip.
  - name: Recreate
    description: Recreate photos and scenes with your trained profiles.
  - name: Profiles
    description: List the trained profiles you can use in Recreate endpoints.
  - name: My data
    description: Read your own account data — credits, usage, generations, images and uploads. You only ever see your own data.

paths:
  /api/v2/jobs/{job_id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get job (poll)
      description: >
        Returns the state of a job. Use it after a `202`. Keep polling while
        `status` is `pending` or `processing`. Poll every 5 seconds — the limit
        is 15 requests a minute **per job**.


        You can only see your own jobs.
      parameters:
        - name: job_id
          in: path
          required: true
          description: The `job_id` you got from the generation request.
          schema:
            type: string
            format: uuid
            example: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
      responses:
        "200":
          description: The job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
              examples:
                completed:
                  summary: Completed job
                  value:
                    status: 200
                    data:
                      job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                      status: completed
                      tool_name: age_modify
                      created_at: "2026-11-05T10:00:00Z"
                      updated_at: "2026-11-05T10:00:21Z"
                      output_urls:
                        - https://example.com/result.jpg
                failed:
                  summary: Failed job
                  value:
                    status: 200
                    data:
                      job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                      status: failed
                      tool_name: age_modify
                      created_at: "2026-11-05T10:00:00Z"
                      updated_at: "2026-11-05T10:00:21Z"
                      error:
                        type: provider_error
                        code: generation_failed
                        message: No picture was produced. Try again.
        "400":
          description: "`invalid_input` — `job_id` is not a valid id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`job_not_found` — no such job for you."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/apps/age-modifier:
    post:
      tags: [Apps]
      operationId: ageModifier
      summary: Age Modifier
      description: >
        Makes the person in a photo look older or younger. The model is chosen
        automatically from the age you ask for.


        **Cost:** 8 credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgeModifierRequest"
            examples:
              older:
                summary: Make someone look 65
                value:
                  image_url: https://example.com/me.jpg
                  target_age: 65
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/apps/watermark-remover:
    post:
      tags: [Apps]
      operationId: watermarkRemover
      summary: Watermark Remover
      description: >
        Removes watermarks, logos, text and stamps from a photo.


        **Cost:** `lite` 2, `pro` 2, `advance` 6 credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatermarkRemoverRequest"
            examples:
              pro:
                summary: Pro tier with instructions
                value:
                  image_url: https://example.com/photo.jpg
                  model_id: pro
                  instructions: stock photo watermark
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/apps/weight-shift:
    post:
      tags: [Apps]
      operationId: weightShift
      summary: Weight Shift
      description: >
        Makes the person in a photo look leaner or fuller. The model is chosen
        automatically. This endpoint does not run an NSFW check.


        **Cost:** 8 credits for every `weight_level` and every photo size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightShiftRequest"
            examples:
              leaner:
                summary: Make someone look leaner
                value:
                  image_url: https://example.com/me.jpg
                  weight_level: -25
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/apps/group-photo:
    post:
      tags: [Apps]
      operationId: groupPhoto
      summary: Group Photo
      description: >
        Puts several people into one group photo that recreates the scene of a
        reference photo.


        **Cost:** `low` 8, `medium` 9, `high` 26 credits. The price is the same
        for 2 or 20 people photos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupPhotoRequest"
            examples:
              basic:
                summary: Two people in a reference scene
                value:
                  input_image_urls:
                    - https://example.com/a.jpg
                    - https://example.com/b.jpg
                  reference_image_url: https://example.com/scene.jpg
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/image/create:
    post:
      tags: [AI Image]
      operationId: imageCreate
      summary: Image create
      description: >
        Makes an image from a prompt. Create takes no images: an
        `input_image_urls` field sent here is ignored. Use
        Image edit to change images.


        `model_id` comes from Image models
        and is the same in the request, the reply and the catalog. Sizes are
        `1K`, `2K` or `4K`.


        **Cost:** per image, by model and quality or resolution (2–30 credits).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageCreateRequest"
            examples:
              basic:
                summary: A 2K widescreen image
                value:
                  prompt: a red fox in the snow
                  aspect_ratio: "16:9"
                  resolution: 2K
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/image/edit:
    post:
      tags: [AI Image]
      operationId: imageEdit
      summary: Image edit
      description: >
        Changes one or more images with a prompt. Takes the same models as
        Image create.


        **Cost:** the same as Image create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageEditRequest"
            examples:
              basic:
                summary: Change the sky
                value:
                  prompt: make the sky a sunset
                  input_image_urls:
                    - https://example.com/photo.jpg
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/image/info:
    get:
      tags: [AI Image]
      operationId: imageModels
      summary: Image models
      description: >
        Lists each image model's `aspect_ratios`, `resolutions` (sizes) or
        `qualities` (tiers), `max_input_image_urls` and `credits` per size or
        per quality.


        Public (no token). Cached for 60 seconds with an `ETag`, and answered
        from memory with no database read.
      security: []
      responses:
        "200":
          description: The image model catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"

  /api/v2/video/create:
    post:
      tags: [AI Video]
      operationId: videoCreate
      summary: Video create
      description: >
        Text to video. Only models that can run from a prompt alone are
        offered. Create reads no frames; use
        Video keyframes for those.


        Video never waits inside the request: every call answers `202` with
        `job_id` and `poll_url`. Poll Get job
        or send a `webhook_url`. `model_id` comes from
        Video models.


        **Cost:** per second, by model and resolution (3–156 credits per second).
        The total is rounded up to a whole credit. Audio does not change the
        price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoCreateRequest"
            examples:
              basic:
                summary: A short text-to-video clip
                value:
                  prompt: a drone shot over a misty forest at sunrise
                  model_id: seedance2
                  duration: 8
                  resolution: 720p
      responses:
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/video/keyframes:
    post:
      tags: [AI Video]
      operationId: videoKeyframes
      summary: Video keyframes
      description: >
        Makes a video that starts from a first frame, and optionally ends on a
        last frame. Always answers `202`; poll
        Get job or send a `webhook_url`.


        MiniMax H3, MiniMax H3 Lite and MiniMax H3 Highspeed list no
        `aspect_ratio` for keyframes (their video follows the start frame), so a
        keyframes call with an `aspect_ratio` for them returns `400`.


        **Cost:** per second, by model and resolution (3–156 credits per second).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoKeyframesRequest"
            examples:
              basic:
                summary: From a start frame
                value:
                  prompt: the camera slowly pulls back
                  start_image_url: https://example.com/start.jpg
                  model_id: wan30
      responses:
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/video/reference:
    post:
      tags: [AI Video]
      operationId: videoReference
      summary: Video reference
      description: >
        Makes a video guided by one or more reference images. Always answers
        `202`; poll Get job or send a
        `webhook_url`.


        **Cost:** per second, by model and resolution (4–28 credits per second).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoReferenceRequest"
            examples:
              basic:
                summary: With one reference image
                value:
                  prompt: the character walks through a market
                  reference_image_urls:
                    - https://example.com/character.jpg
                  model_id: wan30-reference
      responses:
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/video/edit:
    post:
      tags: [AI Video]
      operationId: videoEdit
      summary: Video edit
      description: >
        Changes an existing video clip with a prompt. Always answers `202`; poll
        Get job or send a `webhook_url`.


        There is no `duration`: the result follows the clip, and the job is
        priced from the length we read from the file ourselves. The clip must
        fit the model's `input_video_url` limits (seconds, side pixels, area)
        and 100 MB. A clip outside them returns `400` before any job or charge.
        On edit, `audio` defaults to on for every model with an audio option.


        **Cost:** per second of your clip, by model and resolution (3–56 credits
        per second).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoEditRequest"
            examples:
              basic:
                summary: Restyle a clip
                value:
                  prompt: make it look like a watercolor painting
                  input_video_url: https://example.com/clip.mp4
                  model_id: kling-v4-video-edit
      responses:
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/video/info:
    get:
      tags: [AI Video]
      operationId: videoModels
      summary: Video models
      description: >
        Lists the video models grouped by mode (`create`, `keyframes`,
        `reference`, `edit`), each with its `aspect_ratios`, `durations`,
        `default_duration`, `resolutions`, `audio_supported`, and the mode's own
        limits.


        Public (no token). Cached for 60 seconds with an `ETag`, and answered
        from memory with no database read.
      security: []
      responses:
        "200":
          description: The video model catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"

  /api/v2/recreate:
    post:
      tags: [Recreate]
      operationId: recreate
      summary: Recreate
      description: >
        Restyles a photo to match a reference photo. Optionally keeps the
        identity of your trained profiles.


        **Cost:** 10 credits per image (`num_output_images` 1–4 = 10, 20, 30,
        40).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecreateRequest"
            examples:
              withProfile:
                summary: Keep one profile's identity
                value:
                  input_image_url: https://example.com/me.jpg
                  reference_image_url: https://example.com/style.jpg
                  profile_ids:
                    - b5ccefdfcaca425dbcb2abd6a58e9a09
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/profile-photo:
    post:
      tags: [Recreate]
      operationId: profilePhoto
      summary: Profile Photo
      description: >
        Creates a new photo of your trained profiles from a text prompt. **The
        people go inside the prompt**, written as `[[profile_id]]` with a
        `profile_id` from List profiles.
        There is no separate `profile_ids` field.


        - Write each person as `[[<profile_id>]]`, for example
          `"[[b5ccefdfcaca425dbcb2abd6a58e9a09]] on a beach at sunset"`.
        - Several people: one token each, anywhere in the text.
        - At least one token is required. A prompt without one fails with
          `400 invalid_input`.
        - Every token must be one of your ready profiles. If any one is not
          (unknown, another user's, not ready, deleted), the whole request fails
          with `404 trained_profile_not_found`, and nothing is generated or
          charged.
        - The literal text `[[profile_id]]` is a placeholder, not a profile.


        **Cost:** per image, by model and resolution (10–25 credits). Multiply
        by `num_output_images`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePhotoRequest"
            examples:
              basic:
                summary: One profile on a beach
                value:
                  prompt: "[[b5ccefdfcaca425dbcb2abd6a58e9a09]] on a beach at sunset"
                  resolution: 2K
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/recreate-group:
    post:
      tags: [Recreate]
      operationId: recreateGroup
      summary: Recreate Group
      description: >
        Recreates the scene of a reference photo with 2 to 10 of your trained
        profiles. The first id in `profile_ids` is person 1 in the reference,
        the second is person 2, and so on.


        **Cost:** per image, by model and resolution (10–25 credits). Multiply
        by `num_output_images`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecreateGroupRequest"
            examples:
              basic:
                summary: Two profiles in a reference scene
                value:
                  reference_image_url: https://example.com/scene.jpg
                  profile_ids:
                    - b5ccefdfcaca425dbcb2abd6a58e9a09
                    - 7c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      summary: List profiles
      description: >
        Lists your trained profiles that are ready to use. Each has a
        `profile_id`: send it in `profile_ids` (Recreate, Recreate Group) or as
        `[[profile_id]]` in the prompt (Profile Photo). Profiles are created in
        GoStudio.
      responses:
        "200":
          description: Your ready profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilesResponse"
              example:
                status: 200
                data:
                  profiles:
                    - profile_id: b5ccefdfcaca425dbcb2abd6a58e9a09
                      name: Alex
                      gender: male
                      cover_url: https://example.com/cover.jpg
                      status: ready
                      created_at: "2026-10-01T09:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/my/credit-balance:
    get:
      tags: [My data]
      operationId: getCreditBalance
      summary: Credit balance
      description: >
        Returns how many credits you have now. You only ever see your own data.
      responses:
        "200":
          description: Your current credit balance.
          content:
            application/json:
              schema:
