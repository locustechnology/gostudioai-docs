  /api/v2/users/{userId}/generations:
    get:
      tags: [Users (Admin)]
      summary: List a user's generations
      description: >
        Allowed callers: `internal`, `external`.


        Filter values outside the documented set are ignored rather than
        rejected; no `400` is returned. If every value supplied for a filter is
        unrecognised, that filter is not applied at all and the unfiltered list
        is returned.
      operationId: getUserGenerations
      parameters:
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Until" }
        - name: status
          in: query
          description: >
            Comma-separated statuses. Accepted values: `pending`, `processing`,
            `completed`, `failed`, `abandoned`.
          schema:
            type: string
            example: completed,processing
        - name: media_type
          in: query
          description: >
            Comma-separated media types. Accepted values: `image`, `video`,
            `audio`.
          schema: { type: string, example: image }
        - name: flow_type
          in: query
          description: >
            Comma-separated flow types. Accepted values: `ai_editor`,
            `ai_canvas`, `ai_tools`, `image_generation`, `pack_generation`,
            `global`.
          schema:
            type: string
            example: ai_tools
        - name: tool_name
          in: query
          description: Comma-separated tool names.
          schema: { type: string, example: watermark_remover }
        - name: profile_id
          in: query
          description: >
            Filter by training profile. A non-numeric value — or `0` — is
            ignored and the filter is not applied.
          schema: { type: integer }
        - name: include
          in: query
          description: >
            Include related records. Comma-separated. Accepted values: `images`,
            `samples`. Only one relation is returned per request: if both are
            supplied, only `images` is returned.
          schema: { type: string, example: images }
      responses:
        "200":
          description: Generations returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Generation" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/users/{userId}/images:
    get:
      tags: [Users (Admin)]
      summary: List a user's images
      description: >
        Allowed callers: `internal`, `external`.


        Filter values outside the documented set are ignored rather than
        rejected; no `400` is returned. If every value supplied for a filter is
        unrecognised, that filter is not applied at all and the unfiltered list
        is returned.
      operationId: getUserImages
      parameters:
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Until" }
        - name: media_type
          in: query
          description: >
            Comma-separated media types. Accepted values: `image`, `video`,
            `audio`.
          schema: { type: string, example: image }
        - name: is_liked
          in: query
          description: >
            Exact match on the image's liked flag. Omit for no filter; only the
            literal values `true` and `false` are honoured, anything else is
            ignored.
          schema: { type: boolean }
        - name: is_deleted
          in: query
          description: >
            Exact match on soft-delete state. Defaults to `false` (only live
            records); set `true` to return **only** soft-deleted records, not to
            include them alongside live ones. Only the literal value `true` is
            honoured.
          schema: { type: boolean, default: false }
        - name: tool_name
          in: query
          description: Comma-separated tool names.
          schema: { type: string, example: watermark_remover }
        - name: flow_type
          in: query
          description: >
            Comma-separated flow types. Accepted values: `ai_editor`,
            `ai_canvas`, `ai_tools`, `image_generation`, `pack_generation`,
            `global`.
          schema: { type: string, example: ai_tools }
      responses:
        "200":
          description: Images returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Image" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

