components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Send your API key as a bearer token:
        `Authorization: Bearer <api_key>`


        **Get your API key:** GoStudio → Login → Profile → Account settings →
        Generate API key. See [Authentication](/api-reference/authentication) for the full
        steps.

  parameters:
    Limit:
      name: limit
      in: query
      description: "Number of items per page."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: "Cursor for the next page. Use `next_cursor` from the previous response; omit it for the first page."
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: "Sort order by creation time."
      schema:
        type: string
        enum: [created_at.desc, created_at.asc]
        default: created_at.desc
    Since:
      name: since
      in: query
      description: "Only items created at or after this time (ISO 8601)."
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      description: "Only items created at or before this time (ISO 8601)."
      schema:
        type: string
        format: date-time

  responses:
    GenerationCompleted:
      description: "Job completed. Returned when `mode` is `sync` and the result is ready in time."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenerationCompletedResponse"
          example:
            status: 200
            data:
              job_id: "3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f"
              status: "completed"
              output_urls:
                - "https://example.com/result.jpg"
              credits_deducted: 8
              credit_balance: 112
    GenerationAccepted:
      description: "Job accepted and still processing. Fetch the result from `poll_url`. Do not resend the request."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenerationAcceptedResponse"
          example:
            status: 202
            data:
              job_id: "3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f"
              status: "processing"
              credits_deducted: 8
              poll_url: "https://www.gostudio.ai/api/v2/jobs/3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f"
    BadRequest:
      description: "Invalid request. Nothing was charged."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 400
            error:
              type: "validation_error"
              code: "invalid_input"
              message: "image_url: Required"
    Unauthorized:
      description: "Missing or invalid API key."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 401
            error:
              type: "authentication_error"
              code: "unauthorized"
              message: "Missing or invalid token."
    InsufficientCredits:
      description: "Not enough credits."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 402
            error:
              type: "billing_error"
              code: "insufficient_credits"
              message: "You don't have enough credits."
    Forbidden:
      description: "This API key cannot use this endpoint."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 403
            error:
              type: "permission_error"
              code: "forbidden"
              message: "You don't have permission for this action."
    ProfileNotFound:
      description: "A profile ID is not one of your ready profiles. Nothing was generated or charged."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 404
            error:
              type: "not_found_error"
              code: "trained_profile_not_found"
              message: "Trained profile not found."
    GenerationFailed:
      description: "The result could not be generated. Credits are returned."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 422
            job_id: "3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f"
            error:
              type: "provider_error"
              code: "content_filtered"
              message: "We couldn't generate this image. Please try a different prompt or image."
    RateLimited:
      description: "Too many requests. Wait a moment and try again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 429
            error:
              type: "rate_limit_error"
              code: "rate_limited"
              message: "You're doing that too often. Please wait a moment."
    ServerError:
      description: "A server or provider error occurred. Credits are returned."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 500
            job_id: "3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f"
            error:
              type: "system_error"
              code: "internal_error"
              message: "Something went wrong on our end."

  schemas:
    ErrorResponse:
      type: object
      required: [status, error]
      properties:
        status:
          type: integer
          description: "HTTP status code."
        job_id:
          type: string
          format: uuid
          description: "ID of the job. Present only when the error occurred after the job was created."
        error:
          type: object
          required: [type, code, message]
          description: "Details of the error."
          properties:
            type:
              type: string
              description: "Category of the error."
              enum: [validation_error, authentication_error, permission_error, billing_error, not_found_error, rate_limit_error, provider_error, system_error]
            code:
              type: string
              description: "Machine-readable error code."
            message:
              type: string
              description: "Human-readable explanation."

    GenerationCompletedResponse:
      type: object
      properties:
        status:
          type: integer
          description: "HTTP status code."
        data:
          type: object
          description: "The finished job."
          properties:
            job_id:
              type: string
              format: uuid
              description: "Unique ID of the job."
            status:
              type: string
              enum: [completed]
              description: "State of the job."
            output_urls:
              type: array
              items:
                type: string
                format: uri
              description: "URLs of the generated files."
            credits_deducted:
              type: integer
              description: "Credits charged for this job."
            credit_balance:
              type: integer
              description: "Your remaining credits."

    GenerationAcceptedResponse:
      type: object
      properties:
        status:
          type: integer
          description: "HTTP status code."
        data:
          type: object
          description: "The accepted job."
          properties:
            job_id:
              type: string
              format: uuid
              description: "Unique ID of the job."
            status:
              type: string
              enum: [pending, processing]
              description: "State of the job."
            credits_deducted:
              type: integer
              description: "Credits charged for this job. Returned automatically if the job fails."
            poll_url:
              type: string
              format: uri
              description: "URL to poll for the result. See Get job."

    GenerationCompletedModelResponse:
      type: object
      properties:
        status:
          type: integer
          description: "HTTP status code."
        data:
          type: object
          description: "The finished job."
          properties:
            job_id:
              type: string
              format: uuid
              description: "Unique ID of the job."
            status:
              type: string
              enum: [completed]
              description: "State of the job."
            output_urls:
              type: array
              items:
                type: string
                format: uri
              description: "URLs of the generated files."
            model_id:
              type: string
              description: "Model or tier used for this job."
            credits_deducted:
              type: integer
              description: "Credits charged for this job."
            credit_balance:
              type: integer
              description: "Your remaining credits."

    GenerationAcceptedModelResponse:
      type: object
      properties:
        status:
          type: integer
          description: "HTTP status code."
        data:
          type: object
          description: "The accepted job."
          properties:
            job_id:
              type: string
              format: uuid
              description: "Unique ID of the job."
            status:
              type: string
              enum: [pending, processing]
              description: "State of the job."
            model_id:
              type: string
              description: "Model or tier used for this job."
            credits_deducted:
              type: integer
              description: "Credits charged for this job. Returned automatically if the job fails."
            poll_url:
              type: string
              format: uri
              description: "URL to poll for the result. See Get job."


    JobResponse:
      type: object
      properties:
        status:
          type: integer
          description: "HTTP status code."
        data:
          type: object
          properties:
            job_id:
              type: string
              format: uuid
              description: "Unique ID of the job."
            status:
              type: string
              enum: [pending, processing, completed, failed]
              description: "Current state of the job. Keep polling while it is `pending` or `processing`."
            tool_name:
              type: string
              enum: [age_modify, watermark_remover, weight_shift, group_photo, recreate, ai_image, ai_video]
              description: "Tool that created the job."
            created_at:
              type: string
              format: date-time
              description: "When the job was created."
            updated_at:
              type: string
              format: date-time
              description: "When the job last changed."
            output_urls:
              type: array
              items:
                type: string
                format: uri
              description: "URLs of the generated files. Present only when `status` is `completed`."
            error:
              type: object
              description: "Present only when `status` is `failed`."
              properties:
                type:
                  type: string
                  description: "Category of the error."
                code:
                  type: string
                  description: "Machine-readable error code."
                message:
                  type: string
                  description: "Human-readable explanation."

    ProfilesResponse:
      type: object
      properties:
        status:
          type: integer
          description: "HTTP status code."
        data:
          type: object
          properties:
            profiles:
              type: array
              description: "Your trained profiles that are ready to use."
              items:
                type: object
                properties:
                  profile_id:
                    type: string
                    description: "ID to use in `profile_ids` or as `[[profile_id]]` in a prompt."
                  name:
                    type: string
                    description: "Profile name."
                  gender:
                    type: string
                    description: "Gender set on the profile."
                  cover_url:
                    type: string
                    format: uri
                    description: "Cover image of the profile."
                  status:
                    type: string
                    description: "Profile state. Only `ready` profiles are listed."
                  created_at:
                    type: string
                    format: date-time
                    description: "When the profile was created."

    ModelCatalogResponse:
      type: object
      description: "The model catalog. Each model lists what it supports, such as aspect ratios, resolutions or qualities, durations and credit cost."
      properties:
        status:
          type: integer
          description: "HTTP status code."
        data:
          type: object
          additionalProperties: true

    WebhookUrl:
      type: string
      format: uri
      description: "Optional HTTPS URL that is notified when the job finishes."

    AgeModifierRequest:
      type: object
      required: ["image_url"]
      properties:
        image_url:
          type: string
          format: uri
          description: "Public URL of the photo (`http` or `https`)."
        target_age:
          type: integer
          default: 30
          minimum: 1
          maximum: 100
          description: "Age to show the person at."
        gender:
          type: string
          enum: ["none", "male", "female", "other"]
          default: "none"
          description: "Gender of the person in the photo."
        age_mode:
          type: string
          enum: ["selected_age", "age_progression"]
          default: "selected_age"
          description: "How age is applied. `selected_age` ages the person to `target_age`; `age_progression` applies a natural aging effect."
        webhook_url:
          type: string
          format: uri
          description: "Optional HTTPS URL that is notified when the job finishes."
        mode:
          type: string
          enum: ["sync", "async"]
          default: "sync"
          description: "How the request is processed. `sync` waits for the result (up to 270 seconds); `async` returns a `job_id` immediately."

    WatermarkRemoverRequest:
      type: object
      required: ["image_url"]
      properties:
        image_url:
          type: string
          format: uri
          description: "Public URL of the photo (`http` or `https`)."
        model_id:
          type: string
          enum: ["lite", "pro", "advance"]
          default: "lite"
          description: "Quality tier. `advance` costs more credits than `lite` and `pro`."
        instructions:
          type: string
          description: "What to remove, for example `corner logo`. Used by `pro` and `advance`; ignored by `lite`."
        webhook_url:
          type: string
          format: uri
          description: "Optional HTTPS URL that is notified when the job finishes."
        mode:
          type: string
          enum: ["sync", "async"]
          default: "sync"
          description: "How the request is processed. `sync` waits for the result (up to 270 seconds); `async` returns a `job_id` immediately."

    WeightShiftRequest:
      type: object
      required: ["image_url", "weight_level"]
      properties:
        image_url:
          type: string
          format: uri
          description: "Public URL of the photo (`http` or `https`)."
        weight_level:
          type: integer
          enum: [-50, -25, -10, 10, 25, 50]
          description: "How much to change the person's build. Negative values make them leaner; positive values make them fuller."
        webhook_url:
          type: string
          format: uri
          description: "Optional HTTPS URL that is notified when the job finishes."
        mode:
          type: string
          enum: ["sync", "async"]
          default: "sync"
          description: "How the request is processed. `sync` waits for the result (up to 270 seconds); `async` returns a `job_id` immediately."

    GroupPhotoRequest:
      type: object
      required: ["input_image_urls", "reference_image_url"]
      properties:
        input_image_urls:
          type: array
          items:
            type: string
            format: uri
          minItems: 2
          maxItems: 20
          description: "Photos of the people to include, 2 to 20. Public `http` or `https` URLs."
        reference_image_url:
          type: string
          format: uri
          description: "Photo whose scene is recreated."
        instructions:
          type: string
          description: "Optional extra guidance, for example `everyone smiling`."
        aspect_ratio:
          type: string
          enum: ["auto", "1:1", "3:4", "9:16", "4:3", "16:9"]
          default: "auto"
          description: "Shape of the output image. `auto` matches the reference photo."
        resolution:
          type: string
          enum: ["low", "medium", "high"]
          default: "low"
          description: "Output quality. Higher resolutions cost more credits."
        webhook_url:
          type: string
          format: uri
          description: "Optional HTTPS URL that is notified when the job finishes."
        mode:
          type: string
          enum: ["sync", "async"]
          default: "async"
          description: "How the request is processed. `sync` waits for the result (up to 270 seconds); `async` returns a `job_id` immediately."

    ImageCreateRequest:
      type: object
      required: ["prompt"]
      properties:
        prompt:
          type: string
          description: "Description of the image to create."
        aspect_ratio:
          type: string
          default: "auto"
          description: "Shape of the output image. Use `auto` to let the model choose from the prompt (supported models only), or a value from the model's `aspect_ratios` in Image models."
        model_id:
          type: string
          default: "gpt-image-2-6-sunburst"
          description: "Image model to use. Available IDs and their options are listed in Image models."
        resolution:
          type: string
          enum: ["1K", "2K", "4K"]
          default: "1K"
          description: "Output size, for models that offer sizes. Not accepted by models that use `quality`."
        quality:
          type: string
          enum: ["low", "medium", "high", "xhigh", "max"]
          description: "Output quality, for models that offer quality tiers. `xhigh` and `max` are available on GPT Image 2.6 models only. Not accepted by models that use `resolution`. Default: `medium` (`low` for `gpt-image-2`)."
        webhook_url:
          type: string
          format: uri
          description: "Optional HTTPS URL that is notified when the job finishes."
        mode:
          type: string
          enum: ["sync", "async"]
          default: "sync"
          description: "How the request is processed. `sync` waits for the result (up to 270 seconds); `async` returns a `job_id` immediately."

    ImageEditRequest:
      type: object
      required: ["prompt", "input_image_urls"]
      properties:
        prompt:
          type: string
          description: "Description of the changes to make."
        input_image_urls:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
          description: "Images to edit. Public `http` or `https` URLs, from 1 up to the model's `max_input_image_urls`."
        aspect_ratio:
          type: string
          default: "auto"
          description: "Shape of the output image. Use `auto` to keep the shape of the input image, or a value from the model's `aspect_ratios` in Image models."
        model_id:
          type: string
          default: "gpt-image-2-6-sunburst"
          description: "Image model to use. Available IDs and their options are listed in Image models."
        resolution:
          type: string
          enum: ["1K", "2K", "4K"]
          default: "1K"
          description: "Output size, for models that offer sizes. Not accepted by models that use `quality`."
        quality:
          type: string
          enum: ["low", "medium", "high", "xhigh", "max"]
          description: "Output quality, for models that offer quality tiers. `xhigh` and `max` are available on GPT Image 2.6 models only. Not accepted by models that use `resolution`. Default: `medium` (`low` for `gpt-image-2`)."
        webhook_url:
          type: string
          format: uri
          description: "Optional HTTPS URL that is notified when the job finishes."
        mode:
          type: string
          enum: ["sync", "async"]
          default: "sync"
          description: "How the request is processed. `sync` waits for the result (up to 270 seconds); `async` returns a `job_id` immediately."

    VideoCreateRequest:
      type: object
      required: ["prompt"]
      properties:
        prompt:
          type: string
          description: "Description of the video."
        model_id:
          type: string
          description: "Video model to use. Available IDs for each mode are listed in Video models. Defaults to the default model of the mode."
        aspect_ratio:
          type: string
          description: "Shape of the video. Accepted values depend on the model; defaults to the model's default."
        duration:
          type: integer
          description: "Length in seconds. Accepted values and the default depend on the model."
        resolution:
          type: string
          description: "Output resolution. Accepted values depend on the model."
        audio:
          type: boolean
          description: "Generate audio. Only for models with an audio option."
        webhook_url:
          type: string
          format: uri
          description: "Optional HTTPS URL that is notified when the job finishes."
        mode:
          type: string
          enum: ["async"]
          default: "async"
          description: "Videos always run in the background. Only `async` is accepted."

    VideoKeyframesRequest:
      allOf:
        - $ref: "#/components/schemas/VideoCreateRequest"
        - type: object
          required: [start_image_url]
          properties:
            start_image_url:
              type: string
              format: uri
              description: "URL of the first frame."
            end_image_url:
              type: string
              format: uri
              description: "URL of the last frame. Required, optional or not accepted, depending on the model."

    VideoReferenceRequest:
      allOf:
        - $ref: "#/components/schemas/VideoCreateRequest"
        - type: object
          required: [reference_image_urls]
          properties:
            reference_image_urls:
              type: array
              minItems: 1
              items:
                type: string
                format: uri
              description: "Reference images that guide the video, from 1 up to the model's `max_reference_image_urls`."

    VideoEditRequest:
      type: object
      description: "The result follows the length of the clip, so no `duration` is accepted."
      required: ["prompt", "input_video_url"]
      properties:
        prompt:
          type: string
          description: "Description of the changes to make."
        input_video_url:
          type: string
          format: uri
          description: "Public HTTPS URL of the clip to edit (MP4, MOV or WebM, up to 100 MB). The host must support range requests."
        model_id:
          type: string
          description: "Video model to use. Available IDs are listed in Video models."
        aspect_ratio:
          type: string
          description: "Shape of the video. Accepted values depend on the model."
        resolution:
          type: string
          description: "Output resolution. Accepted values depend on the model."
        audio:
          type: boolean
          description: "Keep or generate audio. On by default for models with an audio option."
        webhook_url:
          type: string
          format: uri
          description: "Optional HTTPS URL that is notified when the job finishes."
        mode:
          type: string
          enum: ["async"]
          default: "async"
          description: "Videos always run in the background. Only `async` is accepted."

    RecreateRequest:
      type: object
      required: ["input_image_url", "reference_image_url"]
