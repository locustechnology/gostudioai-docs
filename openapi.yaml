openapi: 3.0.3
info:
  title: GoStudio API (v2)
  version: "2.0.0"
  description: >
    GoStudio v2 REST API. Every response uses a standard envelope: successes
    return `{ status, data }`; errors return
    `{ status, error: { type, code, dev, message } }`.


    Endpoints declare which **caller type** they accept. `user` is a Supabase
    JWT, `internal` is a service secret, and `external` is a partner API key.
    Sending a token whose caller type is not allowed returns `403 forbidden`.

servers:
  - url: https://www.gostudio.ai
    description: Production

security:
  - bearerAuth: []

tags:
  - name: My Account
    description: Data for the authenticated user (requires a user token).
  - name: Generations
    description: Generation history for the authenticated user.
  - name: Watermark Remover
    description: AI watermark removal — orchestration, model metadata, and job polling.
  - name: Media
    description: >
      Upload media by URL or as direct file uploads.


      **Direct blob upload (large files).** The GoStudio client apps also use a
      two-step direct-to-storage flow — `POST /api/v2/blob/upload-path` followed
      by `POST /api/v2/blob/upload-token`, driven by the Vercel Blob client
      library. That flow is not yet part of the documented REST surface and is
      deliberately not covered here; over HTTP, use `POST /api/v2/me/upload`
      (multipart) or `POST /api/v2/media/upload` (by URL).
  - name: Users (Admin)
    description: >
      Per-user data addressed by user ID. Contains PII, so these accept only
      `internal` and `external` callers — never a user token.
  - name: Webhooks
    description: Endpoints called by external services, not by your application.

paths:
  /api/v2/me/profile:
    get:
      tags: [My Account]
      summary: Get my profile
      description: >
        Returns the authenticated user's profile, usage summary, transactions,
        and a derived segment. Allowed callers: `user`.
      operationId: getMyProfile
      parameters:
        - name: x-generation-logs-limit
          in: header
          required: false
          description: How many recent generation logs to include (default 50, max 500).
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Profile returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { $ref: "#/components/schemas/MeProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/me/credit-balance:
    get:
      tags: [My Account]
      summary: Get my credit balance
      description: "Returns current credit balance and expiry. Allowed callers: `user`."
      operationId: getMyCreditBalance
      responses:
        "200":
          description: Credit balance returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { $ref: "#/components/schemas/CreditBalance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/me/credit-history:
    get:
      tags: [My Account]
      summary: List my credit history
      description: >
        Paginated ledger of credit transactions. Allowed callers: `user`.


        Filter values outside the documented set are ignored rather than
        rejected; no `400` is returned. If every value supplied for a filter is
        unrecognised, that filter is not applied at all and the unfiltered list
        is returned — e.g. `?event=purchase_pack` (a typo for `pack_purchase`)
        returns the entire ledger with `200`.
      operationId: getMyCreditHistory
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Until" }
        - name: type
          in: query
          description: >
            Comma-separated transaction types. Accepted values: `purchase`,
            `deduction`, `debit`, `refund`.
          schema:
            type: string
            example: purchase,deduction
        - name: event
          in: query
          description: >
            Comma-separated credit event types. Accepted values: `user_signup`,
            `pack_purchase`, `addon_purchase`, `model_training`,
            `profile_training`, `image_generation`, `image_edit`,
            `free_headshot_generation`, `video_edit`, `credit_expiry`,
            `ambassador_redeem`, `ai_editor`, `ai_tools`, `ai_canvas`,
            `pack_generation`.
          schema:
            type: string
            example: pack_purchase,image_generation
      responses:
        "200":
          description: Credit history returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/CreditHistoryRow" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/me/generations:
    get:
      tags: [My Account]
      summary: List my generations
      description: >
        Paginated generation logs. Allowed callers: `user`.


        Filter values outside the documented set are ignored rather than
        rejected; no `400` is returned. If every value supplied for a filter is
        unrecognised, that filter is not applied at all and the unfiltered list
        is returned.
      operationId: getMyGenerations
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Until" }
        - name: status
          in: query
          description: >
            Comma-separated statuses. Accepted values: `pending`, `processing`,
            `completed`, `failed`, `abandoned`.
          schema:
            type: string
            example: completed,processing
        - name: media_type
          in: query
          description: >
            Comma-separated media types. Accepted values: `image`, `video`,
            `audio`.
          schema:
            type: string
            example: image
        - name: flow_type
          in: query
          description: >
            Comma-separated flow types. Accepted values: `ai_editor`,
            `ai_canvas`, `ai_tools`, `image_generation`, `pack_generation`,
            `global`.
          schema:
            type: string
            example: ai_tools
        - name: tool_name
          in: query
          description: Comma-separated tool names.
          schema: { type: string, example: watermark_remover }
        - name: profile_id
          in: query
          description: >
            Filter by training profile. A non-numeric value — or `0` — is
            ignored and the filter is not applied.
          schema: { type: integer }
        - name: include
          in: query
          description: >
            Include related records. Comma-separated. Accepted values: `images`,
            `samples`. Only one relation is returned per request: if both are
            supplied, only `images` is returned.
          schema: { type: string, example: images }
      responses:
        "200":
          description: Generations returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Generation" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/me/images:
    get:
      tags: [My Account]
      summary: List my images
      description: >
        Paginated generated images. Allowed callers: `user`.


        Filter values outside the documented set are ignored rather than
        rejected; no `400` is returned. If every value supplied for a filter is
        unrecognised, that filter is not applied at all and the unfiltered list
        is returned.
      operationId: getMyImages
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Until" }
        - name: media_type
          in: query
          description: >
            Comma-separated media types. Accepted values: `image`, `video`,
            `audio`.
          schema: { type: string, example: image }
        - name: is_liked
          in: query
          description: >
            Exact match on the image's liked flag. Omit for no filter; only the
            literal values `true` and `false` are honoured, anything else is
            ignored.
          schema: { type: boolean }
        - name: is_deleted
          in: query
          description: >
            Exact match on soft-delete state. Defaults to `false` (only live
            records); set `true` to return **only** soft-deleted records, not to
            include them alongside live ones. Only the literal value `true` is
            honoured.
          schema: { type: boolean, default: false }
        - name: tool_name
          in: query
          description: Comma-separated tool names.
          schema: { type: string, example: watermark_remover }
        - name: flow_type
          in: query
          description: >
            Comma-separated flow types. Accepted values: `ai_editor`,
            `ai_canvas`, `ai_tools`, `image_generation`, `pack_generation`,
            `global`.
          schema: { type: string, example: ai_tools }
      responses:
        "200":
          description: Images returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Image" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/me/samples:
    get:
      tags: [My Account]
      summary: List my samples
      description: >
        Paginated uploaded samples. Allowed callers: `user`.


        Filter values outside the documented set are ignored rather than
        rejected; no `400` is returned. If every value supplied for a filter is
        unrecognised, that filter is not applied at all and the unfiltered list
        is returned.
      operationId: getMySamples
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Until" }
        - name: purpose
          in: query
          description: >
            Comma-separated purposes. Accepted values: `training`, `input`.
          schema: { type: string, example: training }
        - name: profile_id
          in: query
          description: >
            Filter by training profile. A non-numeric value — or `0` — is
            ignored and the filter is not applied.
          schema: { type: integer }
        - name: upload_source
          in: query
          description: >
            Comma-separated upload sources. Accepted values: `direct`,
            `qr_upload`, `url`.
          schema: { type: string, example: direct }
        - name: media_type
          in: query
          description: >
            Comma-separated media types. Accepted values: `image`, `video`,
            `audio`.
          schema: { type: string, example: image }
        - name: is_deleted
          in: query
          description: >
            Exact match on soft-delete state. Defaults to `false` (only live
            records); set `true` to return **only** soft-deleted records, not to
            include them alongside live ones. Only the literal value `true` is
            honoured.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Samples returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Sample" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/me/upload:
    post:
      tags: [Media]
      summary: Upload files directly
      description: >
        Uploads 1–50 files as `multipart/form-data` for the authenticated user.
        Size limits per kind: images 40 MB, video 100 MB, audio 50 MB,
        documents 40 MB. Only images are NSFW-screened — video, audio and
        document uploads are always stored with `nsfw_checked: false`. Images
        larger than 10 MB also skip the inline check, and the check can be
        turned off per request with the `nsfw_check` field.


        A flagged image is never an HTTP error on this endpoint. It is rejected
        rather than stored, and comes back as an entry in `results` with
        `error: upload_nsfw_rejected`, counted in both `summary.failed` and
        `summary.nsfw_flagged`, inside an otherwise normal `200`. If *every*
        file fails — for any reason — the response is `500`, not `200`.


        This endpoint, together with `POST /api/v2/media/upload` (by URL), is
        the documented HTTP route for uploads. The two-step direct-to-storage
        flow the GoStudio client apps use for very large files is not part of
        this reference — see the Media section overview.


        Allowed callers: `user` only.
      operationId: uploadMyFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: >
                    One to 50 files. The key `file` is also accepted and may be
                    mixed with `files`; entries from both keys are merged and
                    de-duplicated by name + size + content type. A request that
                    sends only `file` is valid despite `files` being listed as
                    required here.
                  items: { type: string, format: binary }
                nsfw_check:
                  type: string
                  default: "true"
                  description: >
                    Send the exact string `false` to skip the NSFW check on
                    images. This is a literal string comparison — any other
                    value (including `0`, `no`, or `False`) leaves the check
                    enabled. Ignored for non-image files and for images over
                    10 MB, which are never checked.
                purpose:
                  type: string
                  nullable: true
                  example: input
                  description: >
                    Free-form label recorded on the moderation log entry if an
                    image is rejected as NSFW. Not stored on the uploaded file.
                tool:
                  type: string
                  nullable: true
                  example: watermark_remover
                  description: >
                    Free-form label recorded on the moderation log entry if an
                    image is rejected as NSFW. Not stored on the uploaded file.
              required: [files]
      responses:
        "200":
          description: >
            At least one file was uploaded successfully. Inspect
            `summary.failed` — a `200` can still contain per-file failures. If
            *every* file fails the response is `500`, not `200` (see below).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { $ref: "#/components/schemas/FileUploadResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: >
            Either an unexpected server error, or every submitted file failed.
            In the all-failed case the body carries **both** `error` (code
            `upload_failed`, dev 50011) **and** a `data` object with the
            per-file reasons — inspect `data.results` to see why each file was
            rejected. This is returned even when the cause is entirely
            client-side: every file was oversized (`file_too_large`), an
            unsupported type (`invalid_file_type`), empty (`empty_file`), or
            NSFW-rejected (`upload_nsfw_rejected`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FileUploadResponse" }
              example:
                status: 500
                error: { type: storage_error, code: upload_failed, dev: 50011, message: "All 1 file(s) failed. See results for details." }
                data:
                  summary: { total: 1, uploaded: 0, failed: 1, nsfw_flagged: 0 }
                  results:
                    - { file_name: "clip.mov", error: "file_too_large", message: "video files must be under 100 MB." }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/generations:
    get:
      tags: [Generations]
      summary: List generations
      description: >
        Paginated generation history for the authenticated user, with richer
        filtering than `/me/generations` — adds `model_key`, `search`, and
        `is_liked`. Note that `is_liked` additionally requires `include=images`.


        Allowed callers: `user`. An internal service token passes the auth gate
        but carries no user context, so this endpoint returns no data for it —
        use `GET /api/v2/users/{userId}/generations` for service-to-service
        access.


        Filter values outside the documented set are ignored rather than
        rejected; no `400` is returned. If every value supplied for a filter is
        unrecognised, that filter is not applied at all and the unfiltered list
        is returned.
      operationId: listGenerations
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Since" }
        - { $ref: "#/components/parameters/Until" }
        - name: status
          in: query
          description: >
            Comma-separated statuses. Accepted values: `pending`, `processing`,
            `completed`, `failed`, `abandoned`.
          schema:
            type: string
            example: completed,processing
        - name: media_type
          in: query
          description: >
            Comma-separated media types. Accepted values: `image`, `video`,
            `audio`.
          schema: { type: string, example: image }
        - name: flow_type
          in: query
          description: >
            Comma-separated flow types. This endpoint accepts a wider set than
            `/me/*` and `/users/{userId}/*`. Accepted values: `ai_editor`,
            `ai_image`, `ai_canvas`, `ai_video`, `ai_tools`, `instant_photo`,
            `image_generation`, `pack_generation`, `global`.
          schema:
            type: string
            example: ai_tools
        - name: tool_name
          in: query
          description: Comma-separated tool names.
          schema: { type: string, example: watermark_remover }
        - name: profile_id
          in: query
          description: >
            Filter by training profile. A non-numeric value — or `0` — is
            ignored and the filter is not applied.
          schema: { type: integer }
        - name: model_key
          in: query
          description: Filter by the AI model used.
          schema: { type: string, example: replicate/pruna-image-edit }
        - name: search
          in: query
          description: Text search across prompts and tool names.
          schema: { type: string, example: headshot }
        - name: is_liked
          in: query
          description: >
            Filter on liked images. `true` returns only generations that have at
            least one liked (non-deleted) image; `false` returns only generations
            that have none. **Requires `include=images`** — sent on its own this
            parameter is silently ignored and the unfiltered list is returned.
            The filter is applied after the page has been read from the database,
            so a filtered page can contain fewer than `limit` items (possibly
            zero) and will usually report `has_more: false` with
            `next_cursor: null` even when older matching generations still exist.
            To enumerate every liked generation reliably, page **without**
            `is_liked` (passing `include=images`) and filter client-side on
            `images[].is_liked`.
          schema: { type: boolean }
        - name: include
          in: query
          description: >
            Include related records. Comma-separated. Accepted values: `images`,
            `samples`. Unlike `/me/generations` and
            `/users/{userId}/generations`, this endpoint returns both relations
            when both are supplied. Pass `images` to make `is_liked` take
            effect.
          schema: { type: string, example: "images,samples" }
      responses:
        "200":
          description: Generations returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AppGeneration" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/generations/{id}:
    get:
      tags: [Generations]
      summary: Get a generation
      description: >
        Returns one generation with its images and samples always embedded.
        Returns `404` if the generation does not exist **or** belongs to another
        user — the response is intentionally identical in both cases so it cannot
        be used to probe for existence. Allowed callers: `user`. (An internal
        service token passes the auth gate but has no user context, so every
        lookup returns `404`.)
      operationId: getGeneration
      parameters:
        - name: id
          in: path
          required: true
          description: Generation ID (positive integer).
          schema: { type: integer, example: 12345 }
      responses:
        "200":
          description: Generation returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { $ref: "#/components/schemas/AppGeneration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/apps/watermark-remover:
    post:
      tags: [Watermark Remover]
      summary: Remove a watermark
      description: >
        Submits an image for watermark removal. This is the endpoint most
        integrations should use — it validates the request, runs the generation,
        writes a generation log, and deducts credits in one call.


        **This call blocks until the image is ready.** Fast models return almost
        immediately. Slower models are polled server-side on your behalf, so the
        response still arrives as a completed `200` — but it can take up to four
        minutes, and the request is cut off at five. Set your client's HTTP
        timeout accordingly; the default in most HTTP libraries is far too short.


        You never need to poll this endpoint's result yourself, and there is no
        fire-and-forget mode — the call always holds the connection until the
        generation finishes, and the completed `200` body is returned either
        way. A `webhook_url` gets you a second copy of that same result payload
        `POST`ed to your server; it does not shorten the request.


        On the `lite` tier that webhook is delivered once, on success only. On
        the async tiers (`pro`, `advance`) it can also arrive with
        `status: "failed"` and an `error` field when the provider reports a
        failure — alongside the HTTP error response — and a completed job may be
        delivered more than once. Treat deliveries as idempotent and key them on
        `job_id`; do not assume `output_urls` are byte-identical across two
        deliveries of the same job.


        If an async job (`pro` / `advance`) is accepted by the provider and is
        later reported failed, the response is `500 internal_error`, not `502`.
        The generation is still marked failed and the credits reserved for it
        are refunded. Handle all `5xx` responses uniformly rather than matching
        on a specific status.


        Allowed callers: `user`. An internal service token passes the auth gate
        but carries no user context, so it cannot submit a generation here.
      operationId: removeWatermark
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatermarkRequest" }
            examples:
              lite:
                summary: Default model
                value:
                  image_url: https://example.com/watermarked.jpg
              tier:
                summary: Named tier with webhook
                value:
                  image_url: https://example.com/watermarked.jpg
                  model_id: pro
                  webhook_url: https://your-app.com/webhooks/gostudio
      responses:
        "200":
          description: Generation completed synchronously.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { $ref: "#/components/schemas/WatermarkSyncResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableContent" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /api/v2/apps/watermark-remover/info:
    get:
      tags: [Watermark Remover]
      summary: Get tool metadata
      description: >
        Returns the available models, their credit cost and tier, the default
        model, tier aliases, polling timings, and UI hints. Call this instead of
        hard-coding model IDs — the model list changes over time.


        Allowed callers: `user`, `internal`.
      operationId: getWatermarkInfo
      responses:
        "200":
          description: Tool metadata returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { $ref: "#/components/schemas/WatermarkInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/apps/watermark-remover/{jobId}:
    get:
      tags: [Watermark Remover]
      summary: Poll job status
      description: >
        Looks up a watermark removal job by its `job_id`. `output_urls` and
        `credits_deducted` appear once `status` is `completed`; `error` appears
        when it is `failed`.


        You do not need this to complete a normal generation — `POST
        /api/v2/apps/watermark-remover` already waits for the result. Use it to
        re-fetch the outputs of an earlier job, or to check on one submitted by
        a request whose connection dropped.


        Allowed callers: `user`. An internal service token passes the auth gate
        but carries no user context, so every lookup returns `404`.
      operationId: getWatermarkJob
      parameters:
        - name: jobId
          in: path
          required: true
          description: The `job_id` returned when the generation was submitted.
          schema: { type: integer, example: 12345 }
      responses:
        "200":
          description: Job status returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { $ref: "#/components/schemas/WatermarkPollResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Job not found, or not owned by the authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                status: 404
                error: { type: not_found_error, code: job_not_found, dev: 40404, message: "Job not found." }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/apps/watermark-remover/generate:
    post:
      tags: [Watermark Remover]
      summary: Generate only (no logging or billing)
      description: >
        Runs the model and returns the output without writing a generation log
        or deducting credits. The result never appears in
        `/api/v2/me/generations`, and it cannot be finalized through `/record` —
        that endpoint only finalizes a generation log that already exists, and
        nothing creates one for this call. Use it only when you do your own
        logging and billing outside GoStudio; most integrations should use
        `POST /api/v2/apps/watermark-remover` instead, which logs the job and
        charges credits for you.


        `webhook_url` also behaves differently here: it is registered directly
        with the upstream model provider as its own callback, so your server
        receives the provider's raw, provider-specific body rather than the
        GoStudio result payload. Synchronous models — including the default
        `lite` tier — ignore it and never call back at all.


        Allowed callers: `user`. An internal service token passes the auth gate
        but carries no user context, so it cannot start a generation here.
      operationId: generateWatermarkRemoval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatermarkGenerateRequest" }
      responses:
        "200":
          description: Generation completed synchronously.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { $ref: "#/components/schemas/WatermarkGenerateSyncResult" }
        "202":
          description: Generation accepted and running asynchronously.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 202 }
                  data: { $ref: "#/components/schemas/WatermarkGenerateAsyncResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableContent" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502":
          description: >
            The upstream model provider failed or was unreachable. Because this
            endpoint writes no generation log and deducts no credits, nothing is
            recorded and there is nothing to refund — just retry the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                status: 502
                error: { type: provider_error, code: provider_bad_gateway, dev: 50200, message: "Generation is having trouble right now. Please try again." }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/apps/watermark-remover/record:
    post:
      tags: [Watermark Remover]
      summary: Record a generation result
      description: >
        Finalizes an existing generation log — stores the output URLs and marks
        the job completed, or marks it failed and refunds the credits that were
        reserved for it at submit time. Credits are deducted when the generation
        is submitted, not here; `credits_deducted` echoes the amount already
        charged. A job can only be finalized once; a second call returns
        `400 invalid_job_status`. If the log carries a `webhook_url` in its
        metadata, or you pass one here, the result is delivered to it.


        Allowed callers: `user`. An internal service token passes the auth gate
        but carries no user context, so the job lookup returns `404`.
      operationId: recordWatermarkResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation_log_id, status]
              properties:
                generation_log_id:
                  type: integer
                  description: The log to finalize. Must belong to the caller.
                  example: 12345
                status:
                  type: string
                  enum: [completed, failed]
                output_urls:
                  type: array
                  description: Required when `status` is `completed`; must be non-empty.
                  items: { type: string, format: uri }
                error:
                  type: string
                  description: Failure reason, used when `status` is `failed`.
                webhook_url:
                  type: string
                  format: uri
                  description: HTTPS URL to deliver the result to. Overrides the log's stored webhook.
            examples:
              completed:
                summary: Mark completed
                value:
                  generation_log_id: 12345
                  status: completed
                  output_urls: ["https://r2.gostudio.ai/g/k7p2qm9x/i/p4w7t1.jpg"]
              failed:
                summary: Mark failed
                value:
                  generation_log_id: 12345
                  status: failed
                  error: Provider returned no output.
      responses:
        "200":
          description: Result recorded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { $ref: "#/components/schemas/WatermarkRecordResult" }
        "400":
          description: >
            Invalid body, unknown status, missing `output_urls` for a completed
            job, or the job was already finalized.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                status: 400
                error: { type: validation_error, code: invalid_job_status, dev: 40037, message: "This job has already been finalized." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Generation log not found, or not owned by the authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                status: 404
                error: { type: not_found_error, code: generation_log_not_found, dev: 40405, message: "Generation log not found." }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/apps/watermark-remover/webhook:
    post:
      tags: [Webhooks]
      summary: Provider callback (internal)
      description: >
        Receives async completion callbacks from the upstream model providers
        (Replicate, Astria, Fal). **Not for your application to call** — configure
        `webhook_url` on a generation request to receive results instead.


        This endpoint is unauthenticated by design and always answers `200` with
        `{ "received": true }`, even for unparseable or unmatched payloads, so a
        provider never enters a retry storm. It does not use the standard
        response envelope.
      operationId: watermarkProviderWebhook
      security: []
      requestBody:
        required: true
        description: Provider-specific payload. The shape varies by provider.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Acknowledged. Always returned, regardless of outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, example: true }

  /api/v2/media/upload:
    post:
      tags: [Media]
      summary: Upload media from URLs
      description: >
        Fetches up to 20 URLs and stores them on the GoStudio CDN. Partial
        success is normal — a `200` means the batch was processed, not that every
        item succeeded, so always read `summary.failed` and inspect each result.
        If every successfully uploaded item is NSFW-flagged, the whole request
        returns `422` instead.


        `user` callers may only upload for themselves; the `user_id` in the body
        is ignored and replaced with the authenticated user's ID. `internal` and
        `external` callers may upload on behalf of any user.


        Allowed callers: `user`, `internal`, `external`.
      operationId: uploadMediaFromUrls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls, user_id]
              properties:
                urls:
                  type: array
                  description: 1–20 URLs to fetch and store.
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: uri }
                user_id:
                  type: string
                  format: uuid
                  description: >
                    Owner of the uploads. Required by the schema, but ignored for
                    `user` callers, who can only upload for themselves.
                nsfw_check:
                  type: boolean
                  default: true
                  description: >
                    Run the NSFW classifier on each item. Images only — video,
                    audio and document items are never screened and are always
                    returned with `nsfw_checked: false`.
                purpose:
                  type: string
                  nullable: true
                  example: input
                tool:
                  type: string
                  nullable: true
                  example: watermark_remover
            example:
              urls: ["https://example.com/a.jpg", "https://example.com/b.png"]
              user_id: 8f14e45f-ceea-467a-9f39-4c1b2a7d0e33
              nsfw_check: true
              purpose: input
      responses:
        "200":
          description: >
            Batch processed. May include per-item failures — check
            `summary.failed`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { $ref: "#/components/schemas/MediaUploadResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Every successfully uploaded item was flagged as NSFW.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                status: 422
                error: { type: validation_error, code: nsfw_content, dev: 42204, message: "All uploaded items were flagged as NSFW." }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

