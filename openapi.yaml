        num_output_images:
          type: integer
          default: 1
          minimum: 1
          maximum: 4
          description: "Number of images to generate. Credits are charged per image."
        output_format:
          type: string
          enum: ["jpeg", "png"]
          default: "jpeg"
          description: "Image file format."
        webhook_url:
          type: string
          format: uri
          description: "Optional HTTPS URL that is notified when the job finishes."
