  /api/v2/recreate-group:
    post:
      tags: [Recreate]
      operationId: recreateGroup
      summary: Recreate Group
      description: >
        Recreates the scene of a reference photo with 2 to 10 of your trained profiles. The first ID in `profile_ids` is person 1 in the reference photo, the second is person 2, and so on.

        **Cost:** 10–25 credits per image, depending on the model and resolution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecreateGroupRequest"
            examples:
              basic:
                summary: Two profiles in a reference scene
                value:
                  reference_image_url: https://example.com/scene.jpg
                  profile_ids:
                    - b5ccefdfcaca425dbcb2abd6a58e9a09
                    - 7c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f
      responses:
        "200":
          description: "Job completed. Returned when `mode` is `sync` and the result is ready in time."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationCompletedModelResponse"
              example:
                status: 200
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: completed
                  output_urls:
                    - https://example.com/result.jpg
                  model_id: nano-banana-2
                  credits_deducted: 10
                  credit_balance: 112
        "202":
          description: "Job accepted and still processing. Fetch the result from `poll_url`. Do not resend the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAcceptedModelResponse"
              example:
                status: 202
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: processing
                  model_id: nano-banana-2
                  credits_deducted: 10
                  poll_url: https://www.gostudio.ai/api/v2/jobs/3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
