openapi: 3.0.3
info:
  title: GoStudio API
  version: "2.0.0"
  description: >
    The GoStudio API v2. Every generation endpoint creates a **job**. You get a
    `job_id` back, and the finished pictures come back either in the same
    response (sync) or when you poll `GET /api/v2/jobs/{job_id}` (async).


    Requests and responses are JSON. Successful responses look like
    `{ "status": 200, "data": { ... } }`. Errors look like
    `{ "status": 4xx, "error": { "type", "code", "message" } }`.


    Credits are taken when a job is accepted and returned automatically if the
    job fails.

servers:
  - url: https://www.gostudio.ai
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Jobs
    description: Check the state of a job after a `202` response.
  - name: Apps
    description: One-step photo tools — Age Modifier, Watermark Remover, Weight Shift and Group Photo.
  - name: AI Image
    description: Create images from a prompt, or edit existing images with a prompt.
  - name: AI Video
    description: Make videos from a prompt, keyframes, reference images or an existing clip.
  - name: Recreate
    description: Recreate photos and scenes with your trained profiles.
  - name: Profiles
    description: List the trained profiles you can use in Recreate endpoints.
  - name: My data
    description: Read your own account data — credits, usage, generations, images and uploads. You only ever see your own data.

paths:
  /api/v2/jobs/{job_id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get job (poll)
      description: >
        Returns the current state of a job. Poll every 5 seconds while `status` is `pending` or `processing` (limit: 15 requests per minute per job). You can only access your own jobs.
      parameters:
        - name: job_id
          in: path
          required: true
          description: "ID of the job, returned by the generation request."
          schema:
            type: string
            format: uuid
            example: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
      responses:
        "200":
          description: "Current state of the job."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
              example:
                status: 200
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: completed
                  tool_name: age_modify
                  created_at: "2026-11-05T10:00:00Z"
                  updated_at: "2026-11-05T10:00:21Z"
                  output_urls:
                    - https://example.com/result.jpg
        "400":
          description: "Invalid job ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Job not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/apps/age-modifier:
    post:
      tags: [Apps]
      operationId: ageModifier
      summary: Age Modifier
      description: >
        Makes the person in a photo look older or younger.

        **Cost:** 8 credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgeModifierRequest"
            examples:
              older:
                summary: Make someone look 65
                value:
                  image_url: https://example.com/me.jpg
                  target_age: 65
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/apps/watermark-remover:
    post:
      tags: [Apps]
      operationId: watermarkRemover
      summary: Watermark Remover
      description: >
        Removes watermarks, logos, text and stamps from a photo.

        **Cost:** `lite` 2 · `pro` 2 · `advance` 6 credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatermarkRemoverRequest"
            examples:
              pro:
                summary: Pro tier with instructions
                value:
                  image_url: https://example.com/photo.jpg
                  model_id: pro
                  instructions: stock photo watermark
      responses:
        "200":
          description: "Job completed. Returned when `mode` is `sync` and the result is ready in time."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationCompletedModelResponse"
              example:
                status: 200
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: completed
                  output_urls:
                    - https://example.com/result.jpg
                  model_id: lite
                  credits_deducted: 2
                  credit_balance: 112
        "202":
          description: "Job accepted and still processing. Fetch the result from `poll_url`. Do not resend the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAcceptedModelResponse"
              example:
                status: 202
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: processing
                  model_id: lite
                  credits_deducted: 2
                  poll_url: https://www.gostudio.ai/api/v2/jobs/3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/apps/weight-shift:
    post:
      tags: [Apps]
      operationId: weightShift
      summary: Weight Shift
      description: >
        Makes the person in a photo look leaner or fuller.

        **Cost:** 8 credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightShiftRequest"
            examples:
              leaner:
                summary: Make someone look leaner
                value:
                  image_url: https://example.com/me.jpg
                  weight_level: -25
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/apps/group-photo:
    post:
      tags: [Apps]
      operationId: groupPhoto
      summary: Group Photo
      description: >
        Combines several people into one group photo that recreates the scene of a reference photo.

        **Cost:** `low` 8 · `medium` 9 · `high` 26 credits, regardless of the number of people.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupPhotoRequest"
            examples:
              basic:
                summary: Two people in a reference scene
                value:
                  input_image_urls:
                    - https://example.com/a.jpg
                    - https://example.com/b.jpg
                  reference_image_url: https://example.com/scene.jpg
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/image/create:
    post:
      tags: [AI Image]
      operationId: imageCreate
      summary: Image create
      description: >
        Creates an image from a text prompt.

        **Cost:** 2–30 credits per image, depending on the model and its quality or resolution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageCreateRequest"
            examples:
              basic:
                summary: A 2K widescreen image
                value:
                  prompt: a red fox in the snow
                  aspect_ratio: "16:9"
                  resolution: 2K
      responses:
        "200":
          description: "Job completed. Returned when `mode` is `sync` and the result is ready in time."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationCompletedModelResponse"
              example:
                status: 200
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: completed
                  output_urls:
                    - https://example.com/result.jpg
                  model_id: gpt-image-2-6-sunburst
                  credits_deducted: 8
                  credit_balance: 112
        "202":
          description: "Job accepted and still processing. Fetch the result from `poll_url`. Do not resend the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAcceptedModelResponse"
              example:
                status: 202
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: processing
                  model_id: gpt-image-2-6-sunburst
                  credits_deducted: 8
                  poll_url: https://www.gostudio.ai/api/v2/jobs/3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/image/edit:
    post:
      tags: [AI Image]
      operationId: imageEdit
      summary: Image edit
      description: >
        Edits one or more images using a text prompt.

        **Cost:** same as Image create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageEditRequest"
            examples:
              basic:
                summary: Change the sky
                value:
                  prompt: make the sky a sunset
                  input_image_urls:
                    - https://example.com/photo.jpg
      responses:
        "200":
          description: "Job completed. Returned when `mode` is `sync` and the result is ready in time."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationCompletedModelResponse"
              example:
                status: 200
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: completed
                  output_urls:
                    - https://example.com/result.jpg
                  model_id: gpt-image-2-6-sunburst
                  credits_deducted: 8
                  credit_balance: 112
        "202":
          description: "Job accepted and still processing. Fetch the result from `poll_url`. Do not resend the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAcceptedModelResponse"
              example:
                status: 202
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: processing
                  model_id: gpt-image-2-6-sunburst
                  credits_deducted: 8
                  poll_url: https://www.gostudio.ai/api/v2/jobs/3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/image/info:
    get:
      tags: [AI Image]
      operationId: imageModels
      summary: Image models
      description: >
        Lists the available image models with their supported aspect ratios, sizes or qualities, input limits and credit cost. Public — no API key needed.
      security: []
      responses:
        "200":
          description: The image model catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"

  /api/v2/video/create:
    post:
      tags: [AI Video]
      operationId: videoCreate
      summary: Video create
      description: >
        Creates a video from a text prompt. Always returns `202`; fetch the result from `poll_url` or use a `webhook_url`.

        **Cost:** 3–156 credits per second, depending on the model and resolution. Audio does not change the price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoCreateRequest"
            examples:
              basic:
                summary: A short text-to-video clip
                value:
                  prompt: a drone shot over a misty forest at sunrise
                  model_id: seedance2
                  duration: 8
                  resolution: 720p
      responses:
        "202":
          description: "Job accepted and still processing. Fetch the result from `poll_url`. Do not resend the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAcceptedModelResponse"
              example:
                status: 202
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: processing
                  model_id: seedance2-fast
                  credits_deducted: 55
                  poll_url: https://www.gostudio.ai/api/v2/jobs/3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/video/keyframes:
    post:
      tags: [AI Video]
      operationId: videoKeyframes
      summary: Video keyframes
      description: >
        Creates a video from a first frame, and optionally a last frame. Always returns `202`.

        **Cost:** 3–156 credits per second, depending on the model and resolution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoKeyframesRequest"
            examples:
              basic:
                summary: From a start frame
                value:
                  prompt: the camera slowly pulls back
                  start_image_url: https://example.com/start.jpg
                  model_id: wan30
      responses:
        "202":
          description: "Job accepted and still processing. Fetch the result from `poll_url`. Do not resend the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAcceptedModelResponse"
              example:
                status: 202
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: processing
                  model_id: seedance2-fast
                  credits_deducted: 55
                  poll_url: https://www.gostudio.ai/api/v2/jobs/3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/video/reference:
    post:
      tags: [AI Video]
      operationId: videoReference
      summary: Video reference
      description: >
        Creates a video guided by reference images. Always returns `202`.

        **Cost:** 4–28 credits per second, depending on the model and resolution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoReferenceRequest"
            examples:
              basic:
                summary: With one reference image
                value:
                  prompt: the character walks through a market
                  reference_image_urls:
                    - https://example.com/character.jpg
                  model_id: wan30-reference
      responses:
        "202":
          description: "Job accepted and still processing. Fetch the result from `poll_url`. Do not resend the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAcceptedModelResponse"
              example:
                status: 202
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: processing
                  model_id: wan30-reference
                  credits_deducted: 50
                  poll_url: https://www.gostudio.ai/api/v2/jobs/3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/video/edit:
    post:
      tags: [AI Video]
      operationId: videoEdit
      summary: Video edit
      description: >
        Edits an existing video clip using a text prompt. Always returns `202`. The price is based on the length of your clip.

        **Cost:** 3–56 credits per second of your clip, depending on the model and resolution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoEditRequest"
            examples:
              basic:
                summary: Restyle a clip
                value:
                  prompt: make it look like a watercolor painting
                  input_video_url: https://example.com/clip.mp4
                  model_id: kling-v4-video-edit
      responses:
        "202":
          description: "Job accepted and still processing. Fetch the result from `poll_url`. Do not resend the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAcceptedModelResponse"
              example:
                status: 202
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: processing
                  model_id: omni-flash-video-edit-v1.2
                  credits_deducted: 27
                  poll_url: https://www.gostudio.ai/api/v2/jobs/3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/video/info:
    get:
      tags: [AI Video]
      operationId: videoModels
      summary: Video models
      description: >
        Lists the available video models for each mode (`create`, `keyframes`, `reference`, `edit`) with their aspect ratios, durations, resolutions, audio support and limits. Public — no API key needed.
      security: []
      responses:
        "200":
          description: The video model catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"

  /api/v2/recreate:
    post:
      tags: [Recreate]
      operationId: recreate
      summary: Recreate
      description: >
        Restyles a photo to match a reference photo, optionally keeping the identity of your trained profiles.

        **Cost:** 10 credits per image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecreateRequest"
            examples:
              withProfile:
                summary: Keep one profile's identity
                value:
                  input_image_url: https://example.com/me.jpg
                  reference_image_url: https://example.com/style.jpg
                  profile_ids:
                    - b5ccefdfcaca425dbcb2abd6a58e9a09
      responses:
        "200":
          $ref: "#/components/responses/GenerationCompleted"
        "202":
          $ref: "#/components/responses/GenerationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "422":
          $ref: "#/components/responses/GenerationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/profile-photo:
    post:
      tags: [Recreate]
      operationId: profilePhoto
      summary: Profile Photo
      description: >
        Creates a new photo of your trained profiles from a text prompt. Reference each person in the prompt as `[[profile_id]]` (IDs come from List profiles). At least one profile is required, and every profile must be one of your ready profiles; otherwise the request fails with `404 trained_profile_not_found` and nothing is charged.

        **Cost:** 10–25 credits per image, depending on the model and resolution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePhotoRequest"
            examples:
              basic:
                summary: One profile on a beach
                value:
                  prompt: "[[b5ccefdfcaca425dbcb2abd6a58e9a09]] on a beach at sunset"
                  resolution: 2K
      responses:
        "200":
          description: "Job completed. Returned when `mode` is `sync` and the result is ready in time."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationCompletedModelResponse"
              example:
                status: 200
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
                  status: completed
                  output_urls:
                    - https://example.com/result.jpg
                  model_id: nano-banana-2
                  credits_deducted: 10
                  credit_balance: 112
        "202":
          description: "Job accepted and still processing. Fetch the result from `poll_url`. Do not resend the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationAcceptedModelResponse"
              example:
                status: 202
                data:
                  job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
