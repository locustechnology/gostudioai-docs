components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Send your API key as a bearer token:
        `Authorization: Bearer <api_key>`


        **Get your API key:** GoStudio → Login → Profile → Account settings →
        Generate API key. See [Authentication](/authentication) for the full
        steps.

  parameters:
    Limit:
      name: limit
      in: query
      description: How many items per page, 1 to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Leave it out for the first page.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: "`created_at.desc` (newest first) or `created_at.asc` (oldest first)."
      schema:
        type: string
        enum: [created_at.desc, created_at.asc]
        default: created_at.desc
    Since:
      name: since
      in: query
      description: Only items created at or after this time (ISO 8601, for example `2026-11-01T00:00:00Z`).
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      description: Only items created at or before this time (ISO 8601).
      schema:
        type: string
        format: date-time

  responses:
    GenerationCompleted:
      description: >
        The job finished inside the request (`mode: sync`). The pictures are in
        `output_urls`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenerationCompletedResponse"
    GenerationAccepted:
      description: >
        The job was accepted and is still running (`mode: async`, or `sync`
        that ran past the wait limit). Fetch the result from `poll_url`. Do
        **not** send the request again — you would pay twice.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenerationAcceptedResponse"
    BadRequest:
      description: >
        The request is wrong and nothing was charged. `invalid_request_body`
        (not a JSON object), `invalid_input` (a field is missing or wrong — the
        `message` names it), `missing_required_field`, `invalid_model_key`
        (the model id is not valid for this tool) or `invalid_webhook_url`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 400
            error:
              type: validation_error
              code: invalid_input
              message: "profile_ids: Array must contain at least 2 element(s)"
    Unauthorized:
      description: "`unauthorized` — missing or wrong token."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 401
            error:
              type: authentication_error
              code: unauthorized
              message: Missing or invalid token.
    InsufficientCredits:
      description: "`insufficient_credits` — not enough credits."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 402
            error:
              type: billing_error
              code: insufficient_credits
              message: You don't have enough credits.
    Forbidden:
      description: "`forbidden` — your token is not allowed on this endpoint."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfileNotFound:
      description: >
        `trained_profile_not_found` — a profile is not one of your ready
        profiles. The `message` names it. Nothing is generated or charged.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GenerationFailed:
      description: >
        The picture could not be made. Credits are returned and the response
        includes `job_id`. Codes: `content_filtered` (the image or text was
        blocked), `provider_request_invalid`, `image_dimensions_invalid` (the
        photo cannot be read) and `output_too_large`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 422
            job_id: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
            error:
              type: provider_error
              code: content_filtered
              message: The image or text was blocked. Try a different one.
    RateLimited:
      description: >
        `rate_limited` — more than 30 requests a minute per endpoint per user
        (15 a minute per job for job status). `provider_rate_limited` means our
        provider is busy; try again in a moment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: >
        A problem on our side or the provider's. Credits are returned. Codes:
        `generation_failed`, `generation_no_output` (500), `internal_error`,
        `db_write_failed`, `credit_deduct_failed` (500), `provider_bad_gateway`
        (502), `model_unavailable` (503) and `generation_timeout` (504).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [status, error]
      properties:
        status:
          type: integer
          example: 402
        job_id:
          type: string
          format: uuid
          description: Present when the error happened after the job was created.
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              description: The kind of error.
              enum:
                - validation_error
                - authentication_error
                - permission_error
                - billing_error
                - not_found_error
                - rate_limit_error
                - provider_error
                - system_error
            code:
              type: string
              example: insufficient_credits
            message:
              type: string
              example: You don't have enough credits.

    GenerationCompletedResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            job_id:
              type: string
              format: uuid
              example: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
            status:
              type: string
              example: completed
            output_urls:
              type: array
              items:
                type: string
                format: uri
              example:
                - https://example.com/result.jpg
            model_id:
              type: string
              description: >
                The model or tier you used. Returned by Watermark Remover,
                Image create/edit, Profile Photo and Recreate Group.
            credits_deducted:
              type: integer
              example: 8
            credit_balance:
              type: integer
              example: 112

    GenerationAcceptedResponse:
      type: object
      properties:
        status:
          type: integer
          example: 202
        data:
          type: object
          properties:
            job_id:
              type: string
              format: uuid
              example: 3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f
            status:
              type: string
              example: processing
            model_id:
              type: string
              description: >
                The model or tier you used. Returned by Watermark Remover,
                Image create/edit, Profile Photo and Recreate Group.
            credits_deducted:
              type: integer
              example: 8
            poll_url:
              type: string
              format: uri
              example: https://www.gostudio.ai/api/v2/jobs/3f2b8c1e-5d4a-4c1b-9e7a-0a1b2c3d4e5f

    JobResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            job_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [pending, processing, completed, failed]
            tool_name:
              type: string
              enum:
                - age_modify
                - watermark_remover
                - weight_shift
                - group_photo
                - recreate
                - ai_image
                - ai_video
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            output_urls:
              type: array
              description: Only when `status` is `completed`.
              items:
                type: string
                format: uri
            error:
              type: object
              description: Only when `status` is `failed`.
              properties:
                type:
                  type: string
                code:
                  type: string
                message:
                  type: string

    ProfilesResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            profiles:
              type: array
              items:
                type: object
                properties:
                  profile_id:
                    type: string
                    example: b5ccefdfcaca425dbcb2abd6a58e9a09
                  name:
                    type: string
                    example: Alex
                  gender:
                    type: string
                    example: male
                  cover_url:
                    type: string
                    format: uri
                  status:
                    type: string
                    example: ready
                  created_at:
                    type: string
                    format: date-time

    ModelCatalogResponse:
      type: object
      description: >
        The model catalog. Each model lists what it supports, such as
        `aspect_ratios`, `resolutions`, `qualities`, `durations` and `credits`.
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          additionalProperties: true

    WebhookUrl:
      type: string
      format: uri
      description: >
        Optional public `https` URL on port 443, with no username or password.
        We `POST` once when the job finishes, and retry up to 5 times within 2
        minutes if the notice fails. Redirects are not followed.

    AgeModifierRequest:
      type: object
      required: [image_url]
      properties:
        image_url:
          type: string
          format: uri
          description: Public `http` or `https` URL of the photo.
        target_age:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
          description: Age to show, 1 to 100.
        gender:
          type: string
          enum: [none, male, female, other]
          default: none
        age_mode:
          type: string
          enum: [selected_age, age_progression]
          default: selected_age
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [sync, async]
          default: sync
          description: >
            `sync` waits for the pictures, up to 270 seconds. `async` returns a
            `202` with a `job_id` at once.

    WatermarkRemoverRequest:
      type: object
      required: [image_url]
      properties:
        image_url:
          type: string
          format: uri
          description: Public `http` or `https` URL of the photo.
        model_id:
          type: string
          enum: [lite, pro, advance]
          default: lite
          description: The quality tier.
        instructions:
          type: string
          description: >
            Tells the model what to remove (for example "corner logo"). Used by
            `pro` and `advance`; ignored for `lite`.
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [sync, async]
          default: sync

    WeightShiftRequest:
      type: object
      required: [image_url, weight_level]
      properties:
        image_url:
          type: string
          format: uri
          description: Public `http` or `https` URL of the photo.
        weight_level:
          type: integer
          enum: [-50, -25, -10, 10, 25, 50]
          description: >
            How much to change: `-50`, `-25`, `-10` (leaner) or `10`, `25`, `50`
            (fuller). Any other value, including `0`, returns `400 invalid_input`.
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [sync, async]
          default: sync

    GroupPhotoRequest:
      type: object
      required: [input_image_urls, reference_image_url]
      properties:
        input_image_urls:
          type: array
          minItems: 2
          maxItems: 20
          items:
            type: string
            format: uri
          description: 2 to 20 photos of the people. Public `http` or `https` URLs.
        reference_image_url:
          type: string
          format: uri
          description: The photo whose scene should be recreated.
        instructions:
          type: string
          description: Extra wishes, for example "everyone smiling".
        aspect_ratio:
          type: string
          enum: [auto, "1:1", "3:4", "9:16", "4:3", "16:9"]
          default: auto
          description: "`auto` uses the shape of the reference photo."
        resolution:
          type: string
          enum: [low, medium, high]
          default: low
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [sync, async]
          default: async

    ImageCreateRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          description: What the image should show.
        aspect_ratio:
          type: string
          default: auto
          description: >
            `auto` (or `custom`, the same) lets the model pick the shape from
            the prompt, for models with `create_accepts_auto_aspect_ratio`; or
            one of the model's `aspect_ratios`.
        model_id:
          type: string
          default: gpt-image-2-6-sunburst
          description: An id from Image models.
        resolution:
          type: string
          enum: ["1K", "2K", "4K"]
          default: 1K
          description: >
            For a model that lists `resolutions` (such as `nano-banana-2.1`).
            Ignored by a model with one fixed size. A model that lists
            `qualities` refuses it.
        quality:
          type: string
          enum: [low, medium, high, xhigh, max]
          description: >
            For a model that lists `qualities` (the GPT image models). Default
            `medium` (`low` for `gpt-image-2`). GPT Image 2.6
            (`gpt-image-2-6-sunburst`, `gpt-image-2-6-flare`) also takes
            `xhigh` and `max`. A model without `qualities` refuses it.
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [sync, async]
          default: sync

    ImageEditRequest:
      type: object
      required: [prompt, input_image_urls]
      properties:
        prompt:
          type: string
          description: What to change.
        input_image_urls:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
          description: >
            1 up to the model's `max_input_image_urls`. Public `http` or
            `https` URLs.
        aspect_ratio:
          type: string
          default: auto
          description: >
            `auto` (or `custom`, the same) keeps the shape of the input image;
            or one of the model's `aspect_ratios`.
        model_id:
          type: string
          default: gpt-image-2-6-sunburst
          description: An id from Image models.
        resolution:
          type: string
          enum: ["1K", "2K", "4K"]
          default: 1K
        quality:
          type: string
          enum: [low, medium, high, xhigh, max]
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [sync, async]
          default: sync

    VideoCreateRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          description: What the video should show.
        model_id:
          type: string
          description: An id from Video models.
        aspect_ratio:
          type: string
          description: >
            Optional. When none is sent, the model's `default_aspect_ratio` from
            the catalog is used. A model that lists no ratios rejects the field.
        duration:
          type: integer
          description: Whole seconds from the model's list. The default is shown in the catalog.
        resolution:
          type: string
          description: Optional, from the model's list.
        audio:
          type: boolean
          description: Only for a model with an audio option.
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [async]
          description: >
            Video always runs in the background. Only `"async"`, or leave it
            out; any other value returns `400`.

    VideoKeyframesRequest:
      allOf:
        - $ref: "#/components/schemas/VideoCreateRequest"
        - type: object
          required: [start_image_url]
          properties:
            start_image_url:
              type: string
              format: uri
              description: URL of the first frame.
            end_image_url:
              type: string
              format: uri
              description: >
                Required by some models, optional for others, rejected by the
                rest (`end_image_url` in the catalog: `required`, `optional` or
                `not_accepted`).

    VideoReferenceRequest:
      allOf:
        - $ref: "#/components/schemas/VideoCreateRequest"
        - type: object
          required: [reference_image_urls]
          properties:
            reference_image_urls:
              type: array
              minItems: 1
              items:
                type: string
                format: uri
              description: 1 up to the model's `max_reference_image_urls`.

    VideoEditRequest:
      type: object
      required: [prompt, input_video_url]
      description: Video edit takes no `duration`; it returns `400` if you send one.
      properties:
        prompt:
          type: string
          description: What to change in the clip.
        input_video_url:
          type: string
          format: uri
          description: >
            Public `https` URL of an MP4, MOV or WebM file on a host that
            supports range requests. Up to 100 MB.
        model_id:
          type: string
          description: An id from Video models.
        aspect_ratio:
          type: string
        resolution:
          type: string
        audio:
          type: boolean
          description: Defaults to on for every model with an audio option.
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [async]

    RecreateRequest:
      type: object
      required: [input_image_url, reference_image_url]
      properties:
        input_image_url:
          type: string
          format: uri
          description: The photo to restyle.
        reference_image_url:
          type: string
          format: uri
          description: The photo whose style to copy.
        instructions:
          type: string
          description: >
            Extra wishes, as plain text. Any `[[...]]` in it is removed: people
            are named only in `profile_ids`.
        profile_ids:
          type: array
          items:
            type: string
          default: []
          description: >
            `profile_id` values from List profiles,
            to keep identities. Every id must be one of your ready profiles; if
            any is not, the request fails with `404 trained_profile_not_found`.
        num_output_images:
          type: integer
          minimum: 1
          maximum: 4
          default: 1
          description: Credits are charged per image.
        output_format:
          type: string
          enum: [jpeg, png]
          default: jpeg
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [sync, async]
          default: async

    ProfilePhotoRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          description: >
            What the photo should show, with each person written as
            `[[profile_id]]` (at least one).
        model_id:
          type: string
          enum: [nano-banana-2, gpt-image-2]
          default: nano-banana-2
        aspect_ratio:
          type: string
          enum: ["1:1", "3:4", "4:3", "9:16", "16:9"]
          default: "3:4"
        resolution:
          type: string
          enum: ["1K", "2K", "4K"]
          default: 1K
          description: Higher costs more credits.
        num_output_images:
          type: integer
          minimum: 1
          maximum: 4
          default: 1
          description: Credits are charged per image.
        output_format:
          type: string
          enum: [jpeg, png]
          default: jpeg
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [sync, async]
          default: async

    RecreateGroupRequest:
      type: object
      required: [reference_image_url, profile_ids]
      properties:
        reference_image_url:
          type: string
          format: uri
          description: The photo whose scene to recreate.
        profile_ids:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: string
          description: >
            2 to 10 `profile_id` values from List profiles,
            in the order of the people in the reference. Every one must be one
            of your ready profiles.
        instructions:
          type: string
          description: >
            Extra wishes, as plain text. Any `[[...]]` in it is removed: people
            are named only in `profile_ids`.
        model_id:
          type: string
          enum: [nano-banana-2, gpt-image-2]
          default: nano-banana-2
        aspect_ratio:
          type: string
          enum: ["1:1", "3:4", "4:3", "9:16", "16:9"]
          default: "4:3"
        resolution:
          type: string
          enum: ["1K", "2K", "4K"]
          default: 1K
        num_output_images:
          type: integer
          minimum: 1
          maximum: 4
          default: 1
          description: Credits are charged per image.
        output_format:
          type: string
          enum: [jpeg, png]
          default: jpeg
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        mode:
          type: string
          enum: [sync, async]
          default: async

    Pagination:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Send as `cursor` to get the next page.
        has_more:
          type: boolean

    ImageItem:
      type: object
      properties:
        id:
          type: integer
          example: 5120
        uri:
          type: string
          format: uri
          description: The file URL.
        media_type:
          type: string
          example: image
        mime_type:
          type: string
          example: image/jpeg
        is_liked:
          type: boolean
        is_disliked:
          type: boolean
        is_edited:
          type: boolean
        bonus_images:
          nullable: true
        config:
          nullable: true
        metadata:
          nullable: true
        generation:
          type: object
          nullable: true
          description: Where it came from. `null` if unknown.
          properties:
            tool_name:
              type: string
              example: age_modify
            flow_type:
              type: string
              example: ai_tools
            media_type:
              type: string
              example: image
        created_at:
          type: string
          format: date-time

    UploadItem:
      type: object
      properties:
        id:
          type: integer
          example: 3301
        uri:
          type: string
          format: uri
        media_type:
          type: string
          example: image
        mime_type:
          type: string
          example: image/jpeg
        config:
          nullable: true
        created_at:
          type: string
          format: date-time

    GenerationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The generation id. It is the same as the `job_id` you got when you made it.
        media_type:
          type: string
          example: image
        flow_type:
          type: string
          example: ai_tools
        tool_name:
          type: string
          example: age_modify
        status:
          type: string
          enum: [pending, processing, completed, failed, abandoned]
        profile_ids:
          type: array
          nullable: true
          items:
            type: string
          description: The trained profiles it used.
        resolution:
          type: string
          nullable: true
        aspect_ratio:
          type: string
          nullable: true
        output_format:
          type: string
          nullable: true
        user_prompt:
          type: string
          nullable: true
          description: The text you typed, if any.
        error:
          type: object
          description: "Only when `failed`: `{ type, code, message }`."
        images:
          type: array
          description: The outputs.
          items:
            $ref: "#/components/schemas/ImageItem"
        input_samples:
          type: array
          description: The files the generation started from.
          items:
            $ref: "#/components/schemas/UploadItem"
        input_images:
          type: array
          description: The gallery images the generation started from.
          items:
            $ref: "#/components/schemas/ImageItem"
        first_frame:
          nullable: true
          description: A video's start frame, or `null`.
        last_frame:
          nullable: true
          description: A video's end frame, or `null`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreditBalanceResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            credits:
              type: integer
              example: 112
              description: Your current credit balance.
            created_at:
              type: string
              format: date-time
              description: When your credit record was created.

    CreditHistoryResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    example: 9021
                  transaction_type:
                    type: string
                    enum: [purchase, deduction, debit, refund]
                  event_type:
                    type: string
                    example: image_generation
                    description: What caused it.
                  amount:
                    type: integer
                    example: -8
                    description: The credits added or taken.
                  balance_after:
                    type: integer
                    example: 112
                  created_at:
                    type: string
                    format: date-time
            pagination:
              $ref: "#/components/schemas/Pagination"

    GenerationListResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/GenerationItem"
            pagination:
              $ref: "#/components/schemas/Pagination"

    GenerationResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: "#/components/schemas/GenerationItem"

    ImageListResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ImageItem"
            pagination:
              $ref: "#/components/schemas/Pagination"

    ImageResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: "#/components/schemas/ImageItem"

    UploadListResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/UploadItem"
            pagination:
              $ref: "#/components/schemas/Pagination"

    UploadResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: "#/components/schemas/UploadItem"
