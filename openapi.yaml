        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v2/webhooks/revenuecat:
    post:
      tags: [Webhooks]
      summary: RevenueCat purchase webhook (internal)
      description: >
        Receives subscription and purchase events from RevenueCat and grants
        credits. **Not for your application to call.** Authorized with a shared
        RevenueCat secret in the `Authorization` header, not a GoStudio bearer
        token. Event handling is idempotent, so a replayed event does not grant
        credits twice.
      operationId: revenueCatWebhook
      security:
        - revenueCatSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: object
                  additionalProperties: true
                  description: >
                    The RevenueCat event. A payload with no `event` is
                    acknowledged with `200` and ignored.
      responses:
        "200":
          description: Event processed or acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  data: { type: object, nullable: true, additionalProperties: true }
        "401":
          description: Missing or invalid webhook authorization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                status: 401
                error: { type: authentication_error, code: webhook_invalid_signature, dev: 40102, message: "Webhook signature is invalid." }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Supabase user JWT (or an internal service token). Send as
        `Authorization: Bearer <token>`.
    revenueCatSecret:
      type: apiKey
      in: header
      name: Authorization
      description: >
        The shared secret configured in the RevenueCat dashboard, sent in the
        `Authorization` header either as the raw value or prefixed with
        `Bearer `. This is not a GoStudio user token.

  parameters:
    Limit:
      name: limit
      in: query
      description: >
        Page size (default 20, max 100). Non-numeric or out-of-range values are
        clamped into 1–100, not rejected.
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    Cursor:
      name: cursor
      in: query
      description: >
        Opaque pagination cursor from a previous response's `next_cursor`. A
        cursor that cannot be decoded is ignored and the first page is returned.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: >
        Sort order by `created_at`. Any value other than `created_at.asc` is
        treated as `created_at.desc`.
      schema:
        type: string
        enum: [created_at.asc, created_at.desc]
        default: created_at.desc
    Since:
      name: since
      in: query
      description: ISO timestamp lower bound (inclusive).
      schema: { type: string, format: date-time }
    Until:
      name: until
      in: query
      description: ISO timestamp upper bound (inclusive).
      schema: { type: string, format: date-time }
    UserId:
      name: userId
      in: path
      required: true
      description: The user's UUID.
      schema: { type: string, format: uuid }
      example: 8f14e45f-ceea-467a-9f39-4c1b2a7d0e33

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 400
            error: { type: validation_error, code: invalid_input, dev: 40001, message: "Some information is invalid." }
    Unauthorized:
      description: Missing or invalid Authorization Bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 401
            error: { type: authentication_error, code: unauthorized, dev: 40100, message: "Missing or invalid Authorization Bearer token." }
    PaymentRequired:
      description: The account does not have enough credits for this request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 402
            error: { type: billing_error, code: insufficient_credits, dev: 40200, message: "You don't have enough credits." }
    Forbidden:
      description: Caller type not allowed for this endpoint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 403
            error: { type: permission_error, code: forbidden, dev: 40300, message: "You don't have permission for this action." }
    NotFound:
      description: Requested record not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 404
            error: { type: not_found_error, code: user_not_found, dev: 40400, message: "User not found." }
    UnprocessableContent:
      description: >
        The request was well-formed but the content could not be processed —
        for example the image was rejected by the model or flagged as NSFW.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 422
            error: { type: provider_error, code: content_filtered, dev: 42205, message: "We couldn't generate this image. Please try a different prompt or image." }
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 429
            error: { type: rate_limit_error, code: rate_limited, dev: 42900, message: "You're doing that too often. Please wait a moment." }
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 500
            error: { type: system_error, code: internal_error, dev: 50000, message: "Something went wrong on our end." }
    BadGateway:
      description: >
        The upstream model provider rejected the submission, was unreachable, or
        returned an unusable response while the job was being submitted or
        checked. The generation is marked failed and the credits reserved for it
        are refunded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 502
            error: { type: provider_error, code: provider_bad_gateway, dev: 50200, message: "Generation is having trouble right now. Please try again." }
    ServiceUnavailable:
      description: >
        A dependency is temporarily unavailable. Auth-dependent endpoints return
        `service_unavailable` (dev 50300) when the auth provider is down;
        generation endpoints return `model_unavailable` (dev 50301) when the
        model provider is. Both are safe to retry with backoff.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 503
            error: { type: system_error, code: service_unavailable, dev: 50300, message: "Auth service is temporarily unavailable." }
    GatewayTimeout:
      description: >
        The upstream model provider took too long to respond, or server-side
        polling gave up after 240 seconds without a result. The generation is
        marked failed and the credits reserved for it are refunded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            status: 504
            error: { type: provider_error, code: generation_timeout, dev: 50400, message: "The request took too long. Please try again." }

  schemas:
    ErrorResponse:
      type: object
      properties:
        status: { type: integer, example: 400 }
        error:
          type: object
          properties:
            type: { type: string, example: validation_error }
            code: { type: string, example: invalid_input }
            dev: { type: integer, example: 40001 }
            message: { type: string, example: "Some information is invalid." }

    Pagination:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page, or null if no more results.
        has_more: { type: boolean }

    CreditBalance:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        credits: { type: number, example: 42 }
        expires_at: { type: string, format: date-time, nullable: true }

    CreditHistoryRow:
      type: object
      properties:
        id: { type: integer }
        transaction_type: { type: string, enum: [purchase, deduction, debit, refund] }
        event_type:
          type: string
          enum:
            [
              user_signup,
              pack_purchase,
              addon_purchase,
              model_training,
              profile_training,
              image_generation,
              image_edit,
              free_headshot_generation,
              video_edit,
              credit_expiry,
              ambassador_redeem,
              ai_editor,
              ai_tools,
              ai_canvas,
              pack_generation,
            ]
          example: image_generation
        amount: { type: number }
        balance_after: { type: number }
        reference_id: { type: integer, nullable: true }
        reference_type: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }

    Generation:
      type: object
      properties:
        id: { type: integer }
        media_type: { type: string }
        flow_type: { type: string }
        tool_name: { type: string, nullable: true }
        status: { type: string, enum: [pending, processing, completed, failed, abandoned] }
        profile_ids: { type: array, items: { type: integer }, nullable: true }
        model_key: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        resolution: { type: string, nullable: true }
        output_format: { type: string, nullable: true }
        prompt_used: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        images:
          type: array
          description: >
            Present only when `include=images`. Soft-deleted images are omitted.
            This nested shape is smaller than the standalone `Image` returned by
            the image list endpoints — it never carries a nested `generation`
            block.
          items: { $ref: "#/components/schemas/EmbeddedImage" }
        samples:
          type: array
          description: >
            Present only when `include=samples`. Soft-deleted samples are
            omitted.
          items: { $ref: "#/components/schemas/Sample" }

    AppGeneration:
      allOf:
        - { $ref: "#/components/schemas/Generation" }
        - type: object
          properties:
            user_prompt:
              type: string
              nullable: true
              description: >
                The prompt exactly as the user typed it, before any internal
                rewriting. Compare with `prompt_used`, which is what was sent to
                the model.

    Image:
      type: object
      properties:
        id: { type: integer }
        uri: { type: string }
        media_type: { type: string }
        mime_type: { type: string, nullable: true }
        is_liked: { type: boolean }
        is_disliked: { type: boolean }
        is_edited: { type: boolean }
        is_custom: { type: boolean }
        bonus_images:
          type: boolean
          description: >
            True when the image was granted as a bonus / promo / gift by an
            admin. Defaults to `false`.
        config: { type: object, additionalProperties: true, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }
        generation:
          type: object
          nullable: true
          properties:
            tool_name: { type: string, nullable: true }
            flow_type: { type: string }
            media_type: { type: string }

    EmbeddedImage:
      type: object
      description: >
        An image as returned inside a generation's `images` array
        (`include=images`). Unlike the standalone `Image` returned by the image
        list endpoints, it never carries a nested `generation` block — the parent
        generation is the enclosing object.
      properties:
        id: { type: integer }
        uri: { type: string }
        media_type: { type: string }
        mime_type: { type: string, nullable: true }
        is_liked: { type: boolean }
        is_disliked: { type: boolean }
        is_edited: { type: boolean }
        is_custom:
          type: boolean
          description: >
            Returned only by `/api/v2/generations` and
            `/api/v2/generations/{id}`. Omitted from the embedded images of
            `/api/v2/me/generations` and `/api/v2/users/{userId}/generations`.
        bonus_images:
          type: boolean
          description: >
            True when the image was granted as a bonus / promo / gift by an
            admin. Defaults to `false`.
        config: { type: object, additionalProperties: true, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }

    Sample:
      type: object
      properties:
        id: { type: integer }
        uri: { type: string }
        media_type: { type: string }
        mime_type: { type: string, nullable: true }
        profile_id: { type: integer, nullable: true }
        upload_source: { type: string, enum: [direct, qr_upload, url] }
        purpose: { type: string, enum: [training, input] }
        config: { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }

    WatermarkRequest:
      type: object
      required: [image_url]
      properties:
        image_url:
          type: string
          format: uri
          description: >
            Publicly accessible `http`/`https` URL of the watermarked image. The
            API fetches it server-side, so it must not sit behind authentication
            or a firewall.
          example: https://example.com/watermarked.jpg
        model_id:
          type: string
          description: >
            Model to run. Accepts either a full model ID or one of the friendly
            tier aliases `lite`, `pro`, `advance`. Defaults to
            `dewatermark/watermark-remover-pro` (the `lite` tier). Cost per run:
            `lite` 4 credits, `pro` 4 credits, `advance` 10 credits. Call
            `/info` for the authoritative figures rather than hard-coding these
            — both the model list and the pricing can change.
          default: dewatermark/watermark-remover-pro
          example: pro
        prompt:
          type: string
          description: >
            Optional guidance. Ignored by models whose `requires_prompt` is
            `false` in the info response.
        webhook_url:
          type: string
          format: uri
          description: >
            HTTPS URL to receive the result when the generation finishes. Must
            be HTTPS; an `http://` URL is rejected with
            `400 invalid_webhook_url`. Delivery is best-effort and
            fire-and-forget: the `POST` is sent once and never retried, the
            response status is ignored, and there is no signature header. If a
            delivery is missed, reconcile with
            `GET /api/v2/apps/watermark-remover/{jobId}`.
          example: https://your-app.com/webhooks/gostudio

    WatermarkGenerateRequest:
      allOf:
        - $ref: "#/components/schemas/WatermarkRequest"
        - type: object
          properties:
            webhook_url:
              type: string
              format: uri
              description: >
                Behaves differently here than on
                `POST /api/v2/apps/watermark-remover`. This URL is registered
                directly with the upstream model provider as its own callback,
                so what your server receives is the provider's raw,
                provider-specific body (Replicate / Astria / Fal) with
                provider-hosted output URLs — not the GoStudio result payload,
                and not GoStudio CDN URLs. It is also ignored entirely by
                synchronous models, including the default
                `dewatermark/watermark-remover-pro` (`lite`), which return their
                output in the `200` response and never call back at all. Use
                `POST /api/v2/apps/watermark-remover` if you want the documented
                result payload delivered to your endpoint.
              example: https://your-app.com/webhooks/gostudio

    WatermarkSyncResult:
      type: object
      properties:
        job_id: { type: integer, example: 12345 }
        status: { type: string, enum: [completed] }
        model_id: { type: string, example: dewatermark/watermark-remover-pro }
        output_urls:
          type: array
          description: CDN URLs for the cleaned images, usable immediately.
          items: { type: string, format: uri }
        credits_deducted: { type: number, example: 4 }
        credit_balance:
          type: number
          description: Remaining balance after this request.
          example: 38

    WatermarkPollResult:
      type: object
      properties:
        job_id: { type: integer }
        status:
          type: string
          enum: [pending, processing, completed, failed, abandoned]
        model_id: { type: string }
        output_urls:
          type: array
          description: Present once the job has completed.
          items: { type: string, format: uri }
        credits_deducted:
          type: number
          description: Present once the job has completed.
        error:
          type: string
          description: Present only when the job failed.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WatermarkGenerateSyncResult:
      type: object
      properties:
        kind: { type: string, enum: [sync] }
        model_id: { type: string }
        output_urls:
          type: array
          description: >
            Stored GoStudio CDN URLs — the sync tier's provider output is
            mirrored to GoStudio storage before it is returned, exactly as on
            the orchestrated endpoint.
          items: { type: string, format: uri }

    WatermarkGenerateAsyncResult:
      type: object
      properties:
        kind: { type: string, enum: [async] }
        model_id: { type: string }
        provider_job_id:
          type: string
          description: >
            The upstream provider's own job identifier. It is not a GoStudio
            `job_id` and cannot be polled with
            `GET /api/v2/apps/watermark-remover/{jobId}`, which needs a
            generation-log ID — and this endpoint writes no log. The provider
            callback is the only way to collect an async result here.
        status: { type: string, enum: [processing] }

    WatermarkRecordResult:
      type: object
      properties:
        generation_log_id: { type: integer }
        status: { type: string, enum: [completed, failed] }
        credits_deducted:
          type: number
          description: >
            The credits already charged for this job when it was submitted, not
            a charge made by this call. Always `0` when `status` is `failed`.
        credit_balance:
          type: number
          description: >
            Always `0` on this endpoint — it does not read your account balance.
            Call `GET /api/v2/me/credit-balance` for the real figure.
          example: 0
        output_urls:
          type: array
          description: Stored CDN URLs. Present on success.
          items: { type: string, format: uri }

    WatermarkInfo:
      type: object
      properties:
        tool:
          type: object
          properties:
            id: { type: string, example: watermark-remover }
            name: { type: string }
            flow_type: { type: string, example: ai_tools }
            cta_label: { type: string }
            result_label: { type: string }
            input:
              type: object
              nullable: true
              properties:
                kind: { type: string }
                accept: { type: string }
                max_mb: { type: number }
            output:
              type: object
              nullable: true
              properties:
                kind: { type: string }
        default_model: { type: string, example: dewatermark/watermark-remover-pro }
        tiers:
          type: object
          description: Friendly tier alias to model ID.
          additionalProperties: { type: string }
          example:
            lite: dewatermark/watermark-remover-pro
            pro: replicate/pruna-image-edit
            advance: astria/seedream-5-pro
        models:
          type: array
          items: { $ref: "#/components/schemas/WatermarkModelInfo" }
        polling:
          type: object
          description: Recommended client polling behaviour for async jobs.
          properties:
            interval_ms: { type: integer, example: 3000 }
            timeout_ms: { type: integer, example: 240000 }
        prompt:
          type: object
          nullable: true
          properties:
            label: { type: string }
            placeholder: { type: string }
            optional: { type: boolean }
            suggestions: { type: array, items: { type: string } }

    WatermarkModelInfo:
      type: object
      properties:
        id: { type: string }
        display_name: { type: string }
        description: { type: string, nullable: true }
        tier: { type: string, nullable: true, example: lite }
        provider: { type: string, example: dewatermark }
        return_mode:
          type: string
          description: Whether this model returns synchronously or asynchronously.
        requires_prompt: { type: boolean }
        pricing:
          type: object
          properties:
            type: { type: string, example: flat }
            credits: { type: number, example: 4 }
        aspect_ratios: { type: array, nullable: true, items: { type: string } }
        resolutions: { type: array, nullable: true, items: { type: string } }
        defaults: { type: object, additionalProperties: true, nullable: true }
        async_timers:
          type: object
          nullable: true
          description: UI hints for how long to wait before reassuring or offering cancel.
          properties:
            still_working_copy_at_ms: { type: integer }
            cancel_retry_button_at_ms: { type: integer }

    MediaUploadSummary:
      type: object
      properties:
        total: { type: integer }
        uploaded: { type: integer }
        failed: { type: integer }
        nsfw_flagged:
          type: integer
          description: >
            Meaning depends on the endpoint. On `POST /api/v2/media/upload` a
            flagged item is still stored, so this is a subset of `uploaded`. On
            `POST /api/v2/me/upload` a flagged image is rejected and never
            stored, so this is a subset of `failed`.

    MediaUploadResponse:
      type: object
      properties:
        results:
          type: array
          description: One entry per input URL, successes and failures mixed.
          items:
            oneOf:
              - $ref: "#/components/schemas/MediaUploadResult"
              - $ref: "#/components/schemas/MediaUploadError"
        summary: { $ref: "#/components/schemas/MediaUploadSummary" }

    MediaUploadResult:
      type: object
      description: >
        A successfully uploaded item. `cdn_url` is always present and is what
        distinguishes this from a `MediaUploadError`.
      required: [cdn_url]
      properties:
        source_url: { type: string, format: uri }
        cdn_url: { type: string, format: uri }
        raw_url: { type: string, format: uri }
        media_type: { type: string, enum: [image, video, audio, document] }
        content_type: { type: string, example: image/jpeg }
        nsfw_checked:
          type: boolean
          description: >
            True only when the item is an image and `nsfw_check` was enabled.
        nsfw_flagged:
          type: boolean
          description: >
            `true` when the classifier flagged this item. The file is stored
            anyway and is still counted in `summary.uploaded`. If every
            successfully uploaded item in the batch is flagged, the request
            returns `422 nsfw_content` instead and no results are returned.

    MediaUploadError:
      type: object
      description: >
        An item that could not be uploaded. `error` is always present and is
        what distinguishes this from a `MediaUploadResult`.
      required: [error]
      properties:
        source_url: { type: string, format: uri }
        error:
          type: string
          description: >
            Per-item failure reason inside `results[]` — distinct from the
            top-level envelope error codes.
          enum: [storage_fetch_failed, invalid_file_type, upload_failed]
          example: storage_fetch_failed
        message: { type: string }

    FileUploadResponse:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/MediaUploadSummary" }
        results:
          type: array
          description: One entry per submitted file, successes and failures mixed.
          items:
            oneOf:
              - $ref: "#/components/schemas/FileUploadResult"
              - $ref: "#/components/schemas/FileUploadError"

    FileUploadResult:
      type: object
      description: >
        A successfully uploaded file. `cdn_url` is always present and is what
        distinguishes this from a `FileUploadError`.
      required: [cdn_url]
      properties:
        file_name: { type: string }
        cdn_url: { type: string, format: uri }
        raw_url: { type: string, format: uri }
        media_type: { type: string }
        content_type: { type: string }
        size: { type: integer, description: Size in bytes. }
        nsfw_checked:
          type: boolean
          description: >
            True only when the item is an image, `nsfw_check` was enabled, and
            the file is 10 MB or smaller.
        nsfw_flagged:
          type: boolean
          example: false
          description: >
            Always `false` on this endpoint. An image that fails the NSFW check
            is returned as a `FileUploadError` with
            `error: upload_nsfw_rejected` and counted in `summary.failed`,
            never as a result.

    FileUploadError:
      type: object
      description: >
        A file that could not be uploaded. `error` is always present and is what
        distinguishes this from a `FileUploadResult`.
      required: [error]
      properties:
        file_name: { type: string }
        error:
          type: string
          description: >
            Per-item failure reason inside `results[]` — distinct from the
            top-level envelope error codes.
          enum:
            [
              empty_file,
              invalid_file_type,
              file_too_large,
              upload_nsfw_rejected,
              upload_failed,
            ]
          example: file_too_large
        message: { type: string }

    MeProfile:
      type: object
      properties:
        user:
          type: object
          properties:
            user_id: { type: string, format: uuid }
            email: { type: string, nullable: true }
            first_name: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            country: { type: string, nullable: true }
            timezone: { type: string, nullable: true }
            email_unsubscribed: { type: boolean }
            created_at: { type: string, format: date-time }
        is_paid_user: { type: boolean }
        usage:
          type: object
          properties:
            trained_models_count: { type: integer }
            ai_tool_runs_count: { type: integer }
            images_generated_count: { type: integer }
            tools_used:
              type: array
              items:
                type: object
                properties:
                  tool: { type: string }
                  count: { type: integer }
            generation_types:
              type: array
              items:
                type: object
                properties:
                  type: { type: string }
                  count: { type: integer }
            by_flow_type:
              type: array
              items:
                type: object
                properties:
                  flow_type: { type: string }
                  count: { type: integer }
            by_tool:
              type: array
              items:
                type: object
                properties:
                  tool_name: { type: string }
                  count: { type: integer }
            last_used_at: { type: string, format: date-time, nullable: true }
            last_generation_at: { type: string, format: date-time, nullable: true }
            recent_generations:
              type: array
              items:
                type: object
                properties:
                  tool_name: { type: string, nullable: true }
                  prompt: { type: string }
                  created_at: { type: string, format: date-time }
        transactions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              product: { type: string, nullable: true }
              currency: { type: string }
              status: { type: string }
              plan_type: { type: string, nullable: true }
              created_at: { type: string, format: date-time }
        derived_segment:
          type: string
          enum: [model_training_user, paying_user, active_free_user, new_user]

    UserSummary:
      allOf:
        - { $ref: "#/components/schemas/MeProfile" }
        - type: object
          properties:
            user:
              type: object
              description: >
                Same as the `/me/profile` user object, plus `dodo_customer_id`,
                which is returned only by this admin endpoint.
              properties:
                user_id: { type: string, format: uuid }
                email: { type: string, nullable: true }
                first_name: { type: string, nullable: true }
                phone: { type: string, nullable: true }
                country: { type: string, nullable: true }
                timezone: { type: string, nullable: true }
                email_unsubscribed: { type: boolean }
                dodo_customer_id:
                  type: array
                  items: { type: string }
                  description: >
                    Payment-processor (Dodo) customer IDs for this user. Empty
                    array if the user has never transacted. Returned only by
                    this endpoint.
                created_at: { type: string, format: date-time }
            email_token:
              type: string
              nullable: true
              description: Signed token for unsubscribe and email-preference links.
